let stab='masuk';
const inDraft={supplierId:'',date:'',ref:'',pay:'lunas',note:'',lines:[],updateBuy:true};
const opCounts=new Map();
let opq='',opcat='',opOnlyDiff=false,opNote='',opLimit=150;
let kartuPid='';
const PANELS={};

VIEWS.stok=function(root){
  root.innerHTML='<div class="tabs" id="stabs"><button type="button" data-t="masuk">Barang masuk</button><button type="button" data-t="opname">Opname</button><button type="button" data-t="kartu">Kartu stok</button><button type="button" data-t="supplier">Pemasok</button></div><div id="spanel"></div>';
  let panel=null;
  function show(t){
    stab=t;
    $$('#stabs button',root).forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    if(panel&&panel.destroy)panel.destroy();
    const el=$('#spanel',root);el.innerHTML='';
    panel=PANELS[t](el);panel.update();
  }
  $('#stabs',root).onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};
  show(stab);
  return {update(){panel&&panel.update()},destroy(){panel&&panel.destroy&&panel.destroy()}};
};

/* ---------- barang masuk ---------- */
PANELS.masuk=function(el){
  if(!inDraft.date)inDraft.date=today();
  el.innerHTML=
  '<div class="split"><section class="card"><h3>Penerimaan barang</h3>'+
   '<div class="form-grid">'+
    '<label class="field"><span>Pemasok</span><select id="in-sup" class="select"></select></label>'+
    '<label class="field"><span>Tanggal terima</span><input id="in-date" type="date" class="input"></label>'+
    '<label class="field"><span>No. faktur / surat jalan</span><input id="in-ref" class="input" autocomplete="off"></label>'+
    '<label class="field"><span>Pembayaran</span><select id="in-pay" class="select"><option value="lunas">Lunas</option><option value="utang">Utang (belum dibayar)</option></select></label>'+
   '</div>'+
   '<div class="pickwrap"><input id="in-q" class="input big" placeholder="Scan barcode atau cari produk yang diterima…" autocomplete="off"><div id="in-sug" class="sugs" hidden></div></div>'+
   '<div id="in-tbl"></div>'+
   '<label class="field"><span>Catatan</span><input id="in-note" class="input" autocomplete="off"></label>'+
   '<label class="check"><input type="checkbox" id="in-upd"> Perbarui harga beli produk sesuai faktur ini</label>'+
   '<div class="foot"><div class="tot">Total<b id="in-tot">Rp 0</b></div><button type="button" class="btn primary" id="in-save">Simpan penerimaan</button></div>'+
  '</section><section class="card"><h3>Penerimaan terakhir</h3><div id="in-hist"></div></section></div>';
  const g=id=>$('#'+id,el);
  g('in-date').value=inDraft.date;g('in-ref').value=inDraft.ref;g('in-pay').value=inDraft.pay;g('in-note').value=inDraft.note;g('in-upd').checked=inDraft.updateBuy;
  g('in-sup').onchange=()=>{inDraft.supplierId=g('in-sup').value};
  g('in-date').onchange=()=>{inDraft.date=g('in-date').value};
  g('in-ref').oninput=()=>{inDraft.ref=g('in-ref').value};
  g('in-pay').onchange=()=>{inDraft.pay=g('in-pay').value};
  g('in-note').oninput=()=>{inDraft.note=g('in-note').value};
  g('in-upd').onchange=()=>{inDraft.updateBuy=g('in-upd').checked};
  const total=()=>inDraft.lines.reduce((a,l)=>a+l.qty*l.buy,0);
  function tbl(){
    if(!inDraft.lines.length){g('in-tbl').innerHTML='<div class="empty" style="padding:24px 8px"><p>Belum ada barang. Scan barcode atau cari produk di atas.</p></div>';g('in-tot').textContent=rp(0);return}
    g('in-tbl').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th style="width:90px">Jumlah</th><th style="width:130px">Harga beli</th><th class="num">Subtotal</th><th></th></tr></thead><tbody>'+
      inDraft.lines.map((l,i)=>'<tr data-i="'+i+'"><td class="nm"><b>'+esc(l.name)+'</b><small>'+esc(l.sku)+'</small></td>'+
        '<td><input class="input sm" data-f="qty" inputmode="numeric" value="'+l.qty+'" aria-label="Jumlah"></td>'+
        '<td><input class="input sm" data-f="buy" inputmode="numeric" value="'+num(l.buy)+'" aria-label="Harga beli"></td>'+
        '<td class="num" data-sub>'+num(l.qty*l.buy)+'</td><td><button type="button" class="icon-btn" data-rm aria-label="Hapus">×</button></td></tr>').join('')+'</tbody></table></div>';
    g('in-tot').textContent=rp(total());
  }
  g('in-tbl').addEventListener('input',e=>{
    const inp=e.target.closest('input[data-f]'),tr=e.target.closest('tr[data-i]');if(!inp||!tr)return;
    const l=inDraft.lines[+tr.dataset.i];if(!l)return;
    const d=digits(inp.value);
    if(inp.dataset.f==='buy')inp.value=d?d.toLocaleString('id-ID'):'';
    l[inp.dataset.f]=d;
    $('[data-sub]',tr).textContent=num(l.qty*l.buy);g('in-tot').textContent=rp(total());
  });
  g('in-tbl').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){inDraft.lines.splice(+b.closest('tr').dataset.i,1);tbl()}});
  picker(g('in-q'),g('in-sug'),p=>{
    if(p.service){toast('Produk jasa tidak memakai stok','warn');return}
    const ex=inDraft.lines.find(l=>l.pid===p.id);
    if(ex)ex.qty++;else inDraft.lines.push({pid:p.id,sku:p.sku,name:p.name,qty:1,buy:+p.buy||0});
    tbl();
  });
  g('in-save').onclick=async()=>{
    if(!inDraft.lines.length){toast('Tambahkan barang dulu','warn');return}
    if(inDraft.lines.some(l=>!(l.qty>0))){toast('Jumlah barang harus lebih dari 0','warn');return}
    if(inDraft.pay==='utang'&&!inDraft.supplierId){toast('Pilih pemasok untuk pembelian utang','warn');return}
    const bt=g('in-save');bt.disabled=true;
    const isToday=inDraft.date===today();
    const ts=isToday||!inDraft.date?Date.now():new Date(inDraft.date+'T12:00:00').getTime();
    const doc={type:'in',ts,supplierId:inDraft.supplierId,supplierName:supName(inDraft.supplierId),ref:inDraft.ref.trim(),note:inDraft.note.trim(),pay:inDraft.pay,
      lines:inDraft.lines.map(l=>({pid:l.pid,sku:l.sku,name:l.name,qty:l.qty,buy:l.buy})),total:total(),settled:inDraft.pay==='lunas',voided:false,cashier:cashierName()};
    try{
      await put('trx','t'+uid(),doc);
      if(inDraft.updateBuy){
        for(const l of inDraft.lines){const p=S.products.get(l.pid);if(p&&l.buy>0&&+p.buy!==l.buy){try{await patch('products',l.pid,{buy:l.buy,updated:Date.now()})}catch(e){}}}
      }
      toast('Penerimaan tersimpan, stok bertambah','ok');
      inDraft.lines=[];inDraft.ref='';inDraft.note='';inDraft.pay='lunas';
      g('in-ref').value='';g('in-note').value='';g('in-pay').value='lunas';tbl();
    }catch(e){toast('Gagal menyimpan: '+msg(e),'bad')}
    bt.disabled=false;
  };
  g('in-hist').onclick=async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const id=b.dataset.id;
    if(b.dataset.act==='paid'){try{await patch('trx',id,{settled:true,settledAt:Date.now()});toast('Ditandai lunas','ok')}catch(er){toast(msg(er),'bad')}}
    else if(b.dataset.act==='void'){
      if(await ask('Batalkan penerimaan ini? Stok yang sudah masuk akan dikurangi kembali.','Batalkan penerimaan',true)){
        try{await patch('trx',id,{voided:true,voidAt:Date.now()});toast('Penerimaan dibatalkan','ok')}catch(er){toast(msg(er),'bad')}
      }
    }
  };
  function hist(){
    const L=[...S.trx.values()].filter(t=>t.type==='in'&&!t.voided).sort((a,b)=>b.ts-a.ts).slice(0,12);
    g('in-hist').innerHTML=L.length?L.map(t=>'<div class="rowline"><div style="min-width:0"><b>'+esc(t.supplierName||supName(t.supplierId)||'Tanpa pemasok')+'</b>'+(t.ref?' <span class="muted">· '+esc(t.ref)+'</span>':'')+
      '<div class="muted sm">'+fmtD(t.ts)+' · '+(t.lines||[]).length+' jenis barang · '+rp(t.total)+'</div></div>'+
      '<div>'+(t.pay==='utang'&&!t.settled?'<span class="badge warn">Utang</span> <button type="button" class="btn ghost sm" data-act="paid" data-id="'+t.id+'">Tandai lunas</button> ':'<span class="badge ok">Lunas</span> ')+
      '<button type="button" class="btn ghost sm" data-act="void" data-id="'+t.id+'">Batalkan</button></div></div>').join(''):'<p class="muted">Belum ada penerimaan barang.</p>';
  }
  function sup(){
    const sel=g('in-sup');
    sel.innerHTML='<option value="">— Tanpa pemasok —</option>'+[...S.suppliers.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'id')).map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');
    sel.value=S.suppliers.has(inDraft.supplierId)?inDraft.supplierId:'';
  }
  tbl();
  return {update(){sup();hist()}};
};

/* ---------- opname ---------- */
PANELS.opname=function(el){
  el.innerHTML=
  '<div class="toolbar"><div class="searchbar"><input id="op-q" class="input" type="search" placeholder="Cari produk yang dihitung…" autocomplete="off"></div>'+
  '<select id="op-cat" class="select" aria-label="Kategori"></select>'+
  '<label class="check"><input type="checkbox" id="op-diff"> Hanya yang selisih</label></div>'+
  '<p class="hint" style="margin:-4px 0 10px">Isi kolom Stok fisik hanya untuk barang yang sudah dihitung. Kosong berarti tidak diubah. Hitung saat tidak ada transaksi supaya selisih akurat.</p>'+
  '<div id="op-tbl"></div><div id="op-more" style="margin-top:10px"></div>'+
  '<div class="card" style="margin-top:14px"><label class="field"><span>Catatan opname</span><input id="op-note" class="input" placeholder="mis. Opname rak A, Nov 2026" autocomplete="off"></label>'+
  '<div class="foot"><div class="tot"><span id="op-n">0</span> barang selisih</div><button type="button" class="btn primary" id="op-save">Simpan opname</button></div></div>';
  const g=id=>$('#'+id,el);
  g('op-q').value=opq;g('op-diff').checked=opOnlyDiff;g('op-note').value=opNote;
  const rows=()=>activeProds().filter(p=>!p.service).filter(p=>!opcat||p.category===opcat).filter(p=>!opq.trim()||matchQ(p,opq)).sort((a,b)=>String(a.rack||'~').localeCompare(String(b.rack||'~'),'id')||String(a.name).localeCompare(String(b.name),'id'));
  const diffOf=p=>{const c=opCounts.get(p.id);return c===undefined||c===''?null:digits(c)-stockOf(p)};
  function counter(){const n=[...opCounts.keys()].filter(id=>{const p=S.products.get(id);return p&&diffOf(p)}).length;g('op-n').textContent=n}
  function tbl(){
    let r=rows();if(opOnlyDiff)r=r.filter(p=>{const d=diffOf(p);return d!==null&&d!==0});
    if(!r.length){g('op-tbl').innerHTML=catEmpty('','Tidak ada produk','Ubah pencarian atau kategori, atau tambahkan produk lebih dulu.');g('op-more').innerHTML='';counter();return}
    const shown=r.slice(0,opLimit);
    g('op-tbl').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th class="hide-sm">Rak</th><th class="num">Stok sistem</th><th style="width:110px">Stok fisik</th><th class="num">Selisih</th></tr></thead><tbody>'+
      shown.map(p=>{
        const c=opCounts.get(p.id),d=diffOf(p);
        return '<tr data-id="'+esc(p.id)+'"><td class="nm"><b>'+esc(p.name)+'</b><small>'+esc(p.sku)+'</small></td><td class="hide-sm">'+esc(p.rack||'—')+'</td><td class="num" data-sys>'+num(stockOf(p))+'</td>'+
          '<td><input class="input sm" inputmode="numeric" value="'+(c===undefined?'':esc(c))+'" aria-label="Stok fisik '+esc(p.name)+'"></td>'+
          '<td class="num" data-d>'+(d===null?'—':(d>0?'+'+d:d))+'</td></tr>';
      }).join('')+'</tbody></table></div>';
    g('op-more').innerHTML=r.length>shown.length?'<button type="button" class="btn ghost" id="op-morebtn">Tampilkan lebih banyak ('+num(r.length-shown.length)+' lagi)</button>':'';
    counter();
  }
  g('op-tbl').addEventListener('input',e=>{
    const inp=e.target.closest('input'),tr=e.target.closest('tr[data-id]');if(!inp||!tr)return;
    const v=inp.value.replace(/\D/g,'');inp.value=v;
    if(v==='')opCounts.delete(tr.dataset.id);else opCounts.set(tr.dataset.id,v);
    const p=S.products.get(tr.dataset.id),d=p?diffOf(p):null,cell=$('[data-d]',tr);
    cell.textContent=d===null?'—':(d>0?'+'+d:d);cell.style.color=d?(d<0?'var(--bad)':'var(--ok)'):'';
    counter();
  });
  g('op-more').onclick=e=>{if(e.target.id==='op-morebtn'){opLimit+=150;tbl()}};
  g('op-q').addEventListener('input',debounce(()=>{opq=g('op-q').value;opLimit=150;tbl()},120));
  g('op-cat').onchange=()=>{opcat=g('op-cat').value;opLimit=150;tbl()};
  g('op-diff').onchange=()=>{opOnlyDiff=g('op-diff').checked;tbl()};
  g('op-note').oninput=()=>{opNote=g('op-note').value};
  g('op-save').onclick=async()=>{
    const lines=[];
    for(const [id,c] of opCounts){
      const p=S.products.get(id);if(!p)continue;
      const sys=stockOf(p),cnt=digits(c);
      if(cnt!==sys)lines.push({pid:id,sku:p.sku,name:p.name,system:sys,counted:cnt,delta:cnt-sys,buy:+p.buy||0});
    }
    if(!lines.length){toast('Tidak ada selisih untuk disimpan','warn');return}
    const bt=g('op-save');bt.disabled=true;
    try{
      await put('trx','t'+uid(),{type:'adjust',ts:Date.now(),note:opNote.trim(),lines,cashier:cashierName(),voided:false});
      opCounts.clear();opNote='';g('op-note').value='';
      toast('Opname tersimpan: '+lines.length+' barang disesuaikan','ok');tbl();
    }catch(e){toast('Gagal menyimpan opname: '+msg(e),'bad')}
    bt.disabled=false;
  };
  function cat(){
    const sel=g('op-cat'),cs=cats();
    sel.innerHTML='<option value="">Semua kategori</option>'+cs.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
    if(opcat&&!cs.includes(opcat))opcat='';
    sel.value=opcat;
  }
  return {update(){
    cat();
    const a=document.activeElement;
    if(a&&a.closest&&a.closest('#op-tbl'))return;   // jangan ganggu saat mengetik
    tbl();
  }};
};

/* ---------- kartu stok ---------- */
PANELS.kartu=function(el){
  el.innerHTML='<div class="card"><div class="pickwrap"><input id="k-q" class="input big" placeholder="Cari produk untuk melihat kartu stoknya…" autocomplete="off"><div id="k-sug" class="sugs" hidden></div></div><div id="k-out"></div></div>';
  const g=id=>$('#'+id,el);
  picker(g('k-q'),g('k-sug'),p=>{kartuPid=p.id;draw()});
  function draw(){
    const p=S.products.get(kartuPid);
    if(!p){g('k-out').innerHTML='<p class="muted">Pilih produk untuk melihat riwayat keluar-masuk stoknya.</p>';return}
    if(p.service){g('k-out').innerHTML='<p class="muted">'+esc(p.name)+' adalah produk jasa dan tidak memakai stok.</p>';return}
    const ev=[];
    for(const t of S.trx.values()){
      if(t.voided)continue;
      const l=(t.lines||[]).find(x=>x.pid===p.id);if(!l)continue;
      if(t.type==='sale')ev.push({ts:t.ts,info:'Penjualan '+(t.no||''),inn:0,out:+l.qty||0});
      else if(t.type==='return')ev.push({ts:t.ts,info:'Retur '+(t.saleNo||''),inn:+l.qty||0,out:0});
      else if(t.type==='in')ev.push({ts:t.ts,info:'Barang masuk'+(t.supplierName?' · '+t.supplierName:'')+(t.ref?' · '+t.ref:''),inn:+l.qty||0,out:0});
      else if(t.type==='adjust')ev.push({ts:t.ts,info:'Opname'+(t.note?' · '+t.note:''),inn:Math.max(0,+l.delta||0),out:Math.max(0,-(+l.delta||0))});
    }
    ev.sort((a,b)=>a.ts-b.ts);
    let bal=+p.opening||0;
    const rows=[{ts:p.created||0,info:'Stok awal',inn:+p.opening||0,out:0,bal}];
    ev.forEach(x=>{bal+=x.inn-x.out;rows.push({...x,bal})});
    g('k-out').innerHTML='<div class="rowline"><div><span class="sku">'+esc(p.sku)+'</span> <b>'+esc(p.name)+'</b><div class="muted sm">Rak '+esc(p.rack||'—')+' · minimum '+num(p.min)+' '+esc(p.unit||'')+'</div></div><div>Stok saat ini <b style="font:700 26px var(--fd)">'+num(stockOf(p))+'</b></div></div>'+
      '<div class="tablewrap"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="num">Masuk</th><th class="num">Keluar</th><th class="num">Saldo</th></tr></thead><tbody>'+
      rows.slice().reverse().map(r=>'<tr><td style="white-space:nowrap">'+(r.ts?fmtDT(r.ts):'—')+'</td><td>'+esc(r.info)+'</td><td class="num">'+(r.inn?num(r.inn):'')+'</td><td class="num">'+(r.out?num(r.out):'')+'</td><td class="num"><b>'+num(r.bal)+'</b></td></tr>').join('')+'</tbody></table></div>';
  }
  return {update(){draw()}};
};

/* ---------- pemasok ---------- */
PANELS.supplier=function(el){
  el.innerHTML='<div class="toolbar"><span class="grow"></span><button type="button" class="btn primary" id="s-add">+ Pemasok baru</button></div><div id="s-list"></div>';
  const g=id=>$('#'+id,el);
  function utang(id){let s=0;for(const t of S.trx.values())if(t.type==='in'&&!t.voided&&t.pay==='utang'&&!t.settled&&t.supplierId===id)s+=+t.total||0;return s}
  function draw(){
    const L=[...S.suppliers.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'id'));
    if(!L.length){g('s-list').innerHTML=catEmpty('','Belum ada pemasok','Catat distributor atau toko tempat Anda kulakan agar penerimaan barang dan utang tercatat rapi.');return}
    g('s-list').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Pemasok</th><th class="hide-sm">Telepon</th><th class="num">Produk</th><th class="num">Utang</th></tr></thead><tbody>'+
      L.map(s=>{const n=[...S.products.values()].filter(p=>p.supplierId===s.id).length,u=utang(s.id);
        return '<tr data-id="'+esc(s.id)+'"><td class="nm"><b>'+esc(s.name)+'</b><small>'+esc(s.address||'')+'</small></td><td class="hide-sm">'+esc(s.phone||'—')+'</td><td class="num">'+n+'</td><td class="num">'+(u?'<span class="badge warn">'+rp(u)+'</span>':'—')+'</td></tr>'}).join('')+'</tbody></table></div>';
  }
  g('s-list').onclick=e=>{const tr=e.target.closest('tr[data-id]');if(tr)supEditor(tr.dataset.id)};
  g('s-add').onclick=()=>supEditor(null);
  return {update(){draw()}};
};
function supEditor(id){
  const old=id?S.suppliers.get(id):null,P=old||{};
  modal({title:old?'Ubah pemasok':'Pemasok baru',lock:true,build:b=>{
    b.innerHTML='<div class="hint bad" id="s-err" hidden></div>'+
    '<label class="field"><span>Nama pemasok</span><input id="s-name" class="input" value="'+esc(P.name||'')+'" autocomplete="off"></label>'+
    '<label class="field"><span>Telepon / WhatsApp</span><input id="s-phone" class="input" value="'+esc(P.phone||'')+'" autocomplete="off"></label>'+
    '<label class="field"><span>Alamat</span><input id="s-addr" class="input" value="'+esc(P.address||'')+'" autocomplete="off"></label>'+
    '<label class="field"><span>Catatan</span><input id="s-note" class="input" value="'+esc(P.note||'')+'" placeholder="mis. jatuh tempo 14 hari" autocomplete="off"></label>';
  },footer:[
    old?{label:'Hapus',cls:'ghost',fn:async a=>{
      if([...S.products.values()].some(p=>p.supplierId===id)){toast('Masih dipakai produk. Pindahkan produknya dulu.','warn');return}
      if(await ask('Hapus pemasok '+old.name+'?','Hapus',true)){try{await del('suppliers',id);toast('Pemasok dihapus','ok');a.close()}catch(e){toast(msg(e),'bad')}}
    }}:null,
    {label:'Batal',cls:'ghost',fn:a=>a.close()},
    {label:'Simpan',cls:'primary',fn:async(a,bt)=>{
      const g=i=>$('#'+i,a.body),name=g('s-name').value.trim();
      if(!name){const e=g('s-err');e.textContent='Nama pemasok wajib diisi.';e.hidden=false;return}
      bt.disabled=true;
      try{await put('suppliers',id||('s'+uid()),{...P,name,phone:g('s-phone').value.trim(),address:g('s-addr').value.trim(),note:g('s-note').value.trim()});toast('Pemasok tersimpan','ok');a.close()}
      catch(e){toast(msg(e),'bad');bt.disabled=false}
    }}
  ].filter(Boolean)});
}

/* ================= RIWAYAT ================= */
let rfrom='',rto='',rq='',rst='';
const refundOf=id=>returnsOf(id).reduce((a,r)=>a+(+r.refund||0),0);
const saleStatus=t=>t.voided?'<span class="badge bad">Batal</span>':((t.method==='tempo'&&!t.settled?'<span class="badge warn">Tempo</span>':'<span class="badge ok">Lunas</span>')+(returnsOf(t.id).length?' <span class="badge warn">Retur</span>':''));
VIEWS.riwayat=function(root){
  if(!rfrom){rfrom=today();rto=today()}
  root.innerHTML=
  '<div class="toolbar"><label class="field"><span>Dari</span><input id="r-from" type="date" class="input"></label><label class="field"><span>Sampai</span><input id="r-to" type="date" class="input"></label>'+
  '<div class="searchbar" style="align-self:flex-end"><input id="r-q" class="input" type="search" placeholder="Cari no. nota atau pelanggan…" autocomplete="off"></div>'+
  '<select id="r-st" class="select" style="align-self:flex-end" aria-label="Status"><option value="">Semua status</option><option value="tempo">Tempo belum lunas</option><option value="void">Dibatalkan</option></select></div>'+
  '<div id="r-sum" class="muted" style="margin-bottom:10px"></div><div id="r-body"></div>';
  const g=id=>$('#'+id,root);
  g('r-from').value=rfrom;g('r-to').value=rto;g('r-q').value=rq;g('r-st').value=rst;
  const own=()=>eff()<2;   // kasir hanya melihat nota sendiri, hari ini
  function rows(){
    const a=startOfDay(own()?today():(rfrom||today())),b=endOfDay(own()?today():(rto||today()));
    return [...S.trx.values()].filter(t=>t.type==='sale'&&t.ts>=a&&t.ts<=b).filter(t=>!own()||(SESSION&&t.cashierId===SESSION.id)).filter(t=>{
      if(rst==='tempo')return !t.voided&&t.method==='tempo'&&!t.settled;
      if(rst==='void')return !!t.voided;
      return true;
    }).filter(t=>!rq.trim()||(String(t.no||'')+' '+String(t.customer||'')).toLowerCase().includes(rq.trim().toLowerCase())).sort((x,y)=>y.ts-x.ts);
  }
  function draw(){
    const r=rows(),ok=r.filter(t=>!t.voided);
    const ret=ok.reduce((a,t)=>a+refundOf(t.id),0),omzet=ok.reduce((a,t)=>a+(+t.total||0),0)-ret;
    g('r-sum').innerHTML='<b>'+num(ok.length)+'</b> nota · omzet <b>'+rp(omzet)+'</b>'+(ret?' <span class="muted sm">(sudah dikurangi retur '+rp(ret)+')</span>':'')+(r.length!==ok.length?' · '+(r.length-ok.length)+' dibatalkan':'');
    if(!r.length){g('r-body').innerHTML=catEmpty('','Tidak ada transaksi','Belum ada penjualan pada rentang tanggal ini.');return}
    g('r-body').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>No. nota</th><th>Waktu</th><th class="hide-sm">Pelanggan</th><th class="num hide-sm">Item</th><th class="num">Total</th><th>Bayar</th><th>Status</th></tr></thead><tbody>'+
      r.slice(0,300).map(t=>'<tr data-id="'+esc(t.id)+'" class="'+(t.voided?'off':'')+'"><td><span class="sku">'+esc(t.no||t.id)+'</span></td><td style="white-space:nowrap">'+fmtDT(t.ts)+'</td><td class="hide-sm">'+esc(t.customer||'—')+'</td><td class="num hide-sm">'+(t.lines||[]).reduce((a,l)=>a+(+l.qty||0),0)+'</td><td class="num"><b>'+num(t.total)+'</b></td><td>'+esc(PAYL[t.method]||t.method||'')+'</td><td>'+saleStatus(t)+'</td></tr>').join('')+'</tbody></table></div>'+
      (r.length>300?'<p class="hint" style="margin-top:8px">Menampilkan 300 nota terbaru. Persempit rentang tanggal untuk melihat yang lain.</p>':'');
  }
  g('r-from').onchange=()=>{rfrom=g('r-from').value||today();draw()};
  g('r-to').onchange=()=>{rto=g('r-to').value||today();draw()};
  g('r-q').addEventListener('input',debounce(()=>{rq=g('r-q').value;draw()},120));

  return {update(){g('r-from').parentNode.hidden=own();g('r-to').parentNode.hidden=own();draw()}};
};

function returnDialog(t,parentApi){
  const rq=returnedQty(t.id),lines=(t.lines||[]).map(l=>({...l,left:(+l.qty||0)-(rq.get(l.pid)||0)})).filter(l=>l.left>0);
  if(!lines.length){toast('Semua barang di nota ini sudah diretur','warn');return}
  const ratio=(+t.sub>0)?(+t.total/+t.sub):1;
  const unsettled=t.method==='tempo'&&!t.settled;
  const qty={};lines.forEach(l=>{qty[l.pid]=0});
  const calc=()=>{
    const n=lines.reduce((a,l)=>a+qty[l.pid],0);
    const full=n>0&&lines.every(l=>qty[l.pid]===l.left);
    const prior=refundOf(t.id);
    const raw=lines.reduce((a,l)=>a+qty[l.pid]*(+l.price||0)*ratio,0);
    const refund=full?Math.max(0,(+t.total||0)-prior):Math.round(raw);
    const tax=(+t.total>0)?Math.round((+t.tax||0)*refund/(+t.total)):0;
    return {n,refund,tax};
  };
  modal({title:'Retur '+(t.no||''),wide:true,build:(b)=>{
    b.innerHTML='<p class="muted sm">Isi jumlah barang yang dikembalikan pelanggan. Stok bertambah kembali dan omzet berkurang sebesar nilai retur (sudah memperhitungkan diskon nota).</p>'+
      '<div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th class="num">Bisa diretur</th><th class="num">Harga</th><th class="num">Retur</th></tr></thead><tbody>'+
      lines.map(l=>'<tr><td class="nm"><b>'+esc(l.name)+'</b><small>'+esc(l.sku)+'</small></td><td class="num">'+num(l.left)+'</td><td class="num">'+num(l.price)+'</td><td class="num"><input class="input" style="width:84px;text-align:right" inputmode="numeric" data-pid="'+esc(l.pid)+'" placeholder="0"></td></tr>').join('')+'</tbody></table></div>'+
      '<div class="rowline"><label class="field" style="min-width:200px"><span>Pengembalian uang</span><select id="rt-meth" class="select">'+(unsettled?'<option value="piutang">Kurangi piutang</option>':'')+'<option value="cash">Tunai</option><option value="transfer">Transfer</option><option value="qris">QRIS</option></select></label>'+
      '<label class="field" style="flex:1;min-width:200px"><span>Catatan (opsional)</span><input id="rt-note" class="input" placeholder="Misal: salah ukuran, barang cacat" autocomplete="off"></label></div>'+
      '<div class="change"><span>Nilai retur</span><strong id="rt-val">Rp 0</strong></div>';
    b.oninput=e=>{
      const el=e.target.closest('input[data-pid]');if(!el)return;
      const l=lines.find(x=>x.pid===el.dataset.pid);
      let v=parseInt(String(el.value).replace(/\D/g,''),10)||0;
      if(v>l.left){v=l.left;el.value=v}
      qty[l.pid]=v;
      $('#rt-val',b).textContent=rp(calc().refund);
    };
  },footer:[
    {label:'Batal',cls:'ghost',fn:a=>a.close()},
    {label:'Simpan retur',cls:'amber',fn:async (a)=>{
      const c=calc();
      if(!c.n){toast('Isi jumlah barang yang diretur','warn');return}
      const meth=$('#rt-meth',a.body).value,note=$('#rt-note',a.body).value.trim();
      const au=await authorize(2,'Retur barang untuk nota '+(t.no||'')+' perlu PIN manajer atau pemilik.');
      if(!au)return;
      const now=Date.now(),key=dayKey(now).replace(/-/g,'').slice(2);
      let n=0;for(const x of S.trx.values())if(x.type==='return'&&x.no&&x.no.indexOf('RTN-'+key)===0)n++;
      const doc={type:'return',ts:now,no:'RTN-'+key+'-'+String(n+1).padStart(4,'0'),saleId:t.id,saleNo:t.no||'',by:au.name,customer:t.customer||'',
        lines:lines.filter(l=>qty[l.pid]>0).map(l=>({pid:l.pid,sku:l.sku,name:l.name,qty:qty[l.pid],price:l.price,buy:l.buy||0,service:!!l.service})),
        refund:c.refund,tax:c.tax,method:meth,note,voided:false};
      try{await put('trx','t'+uid(),doc);toast('Retur '+doc.no+' tersimpan · stok kembali bertambah','ok');a.close();parentApi&&parentApi.close()}
      catch(e){toast(msg(e),'bad')}
    }}
  ]});
}

let lpre='7';
const short=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+' jt':(n>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n)));
const niceMax=m=>{if(m<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(m)));for(const s of [1,2,2.5,4,5,10]){if(s*p>=m)return s*p}return 10*p};
VIEWS.laporan=function(root){
  root.innerHTML=
  '<div class="toolbar"><div class="seg" id="l-pre" style="max-width:520px"><button type="button" data-p="today">Hari ini</button><button type="button" data-p="7">7 hari</button><button type="button" data-p="30">30 hari</button><button type="button" data-p="month">Bulan ini</button><button type="button" data-p="all">Semua</button></div><span class="grow"></span><button type="button" class="btn ghost" id="l-exp">Ekspor penjualan (CSV)</button></div>'+
  '<div id="l-body"></div>';
  const g=id=>$('#'+id,root);
  function range(){
    const now=Date.now(),t0=startOfDay(today());
    if(lpre==='today')return [t0,now];
    if(lpre==='7')return [t0-6*864e5,now];
    if(lpre==='30')return [t0-29*864e5,now];
    if(lpre==='month'){const d=new Date();return [new Date(d.getFullYear(),d.getMonth(),1).getTime(),now]}
    return [0,now];
  }
  const salesIn=()=>{const [a,b]=range();return [...S.trx.values()].filter(t=>t.type==='sale'&&!t.voided&&t.ts>=a&&t.ts<=b)};
  const retIn=()=>{const [a,b]=range();return [...S.trx.values()].filter(t=>t.type==='return'&&!t.voided&&t.ts>=a&&t.ts<=b)};
  function draw(){
    $$('#l-pre button',root).forEach(b=>b.classList.toggle('on',b.dataset.p===lpre));
    const sales=salesIn();
    let omzet=0,hpp=0,tax=0;const prod=new Map(),meth={};
    sales.forEach(t=>{
      omzet+=+t.total||0;tax+=+t.tax||0;
      payParts(t).forEach(x=>{meth[x.m]=(meth[x.m]||0)+(+x.amt||0)});
      (t.lines||[]).forEach(l=>{
        hpp+=(+l.buy||0)*(+l.qty||0);
        const k=l.pid||l.name,o=prod.get(k)||{name:l.name,qty:0,rev:0};o.qty+=+l.qty||0;o.rev+=(+l.qty||0)*(+l.price||0);prod.set(k,o);
      });
    });
    const rets=retIn();let retTotal=0;
    rets.forEach(r=>{
      retTotal+=+r.refund||0;omzet-=+r.refund||0;tax-=+r.tax||0;
      const mk=r.method==='piutang'?'tempo':r.method;meth[mk]=(meth[mk]||0)-(+r.refund||0);
      (r.lines||[]).forEach(l=>{
        hpp-=(+l.buy||0)*(+l.qty||0);
        const k=l.pid||l.name,o=prod.get(k)||{name:l.name,qty:0,rev:0};o.qty-=+l.qty||0;o.rev-=(+l.qty||0)*(+l.price||0);prod.set(k,o);
      });
    });
    Object.keys(meth).forEach(k=>{if(Math.abs(meth[k])<1)delete meth[k]});
    const laba=omzet-tax-hpp;
    let piutang=0;for(const t of S.trx.values())if(t.type==='sale'&&!t.voided&&t.method==='tempo'&&!t.settled)piutang+=(+t.total||0)-returnsOf(t.id).filter(r=>r.method==='piutang').reduce((a,r)=>a+(+r.refund||0),0);
    let nilai=0,low=[];
    for(const p of S.products.values()){
      if(p.service||p.active===false)continue;
      const s=stockOf(p);nilai+=Math.max(0,s)*(+p.buy||0);
      if(s<=(+p.min||0))low.push({p,s});
    }
    low.sort((a,b)=>(a.s-(+a.p.min||0))-(b.s-(+b.p.min||0)));
    // grafik harian
    const days=[];const nd=lpre==='today'?1:(lpre==='7'?7:(lpre==='month'?new Date().getDate():30));
    for(let i=nd-1;i>=0;i--)days.push(dayKey(startOfDay(today())-i*864e5+3.6e6));
    const sum={};days.forEach(d=>sum[d]=0);
    const [a0]=range();
    [...S.trx.values()].filter(t=>(t.type==='sale'||t.type==='return')&&!t.voided).forEach(t=>{const k=dayKey(t.ts);if(k in sum)sum[k]+=t.type==='sale'?(+t.total||0):-(+t.refund||0)});
    const mx=niceMax(Math.max(0,...days.map(d=>sum[d])));
    const W=640,H=230,ml=52,mr=8,mt=10,mb=28,pw=W-ml-mr,ph=H-mt-mb,bw=Math.min(40,pw/days.length*0.7);
    let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Omzet harian">';
    for(let i=0;i<=4;i++){const v=mx/4*i,y=mt+ph-(v/mx)*ph;svg+='<line class="grid-l" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(ml-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(v)+'</text>'}
    const step=Math.ceil(days.length/12);
    days.forEach((d,i)=>{
      const cx=ml+pw*(i+.5)/days.length,h=(sum[d]/mx)*ph,y=mt+ph-h;
      svg+='<rect class="bar'+(d===today()?' now':'')+'" x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,sum[d]>0?1:0)+'" rx="1"><title>'+esc(fmtD(startOfDay(d)))+': '+rp(sum[d])+'</title></rect>';
      if(i%step===0||i===days.length-1)svg+='<text class="ax" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+(+d.slice(8))+'</text>';
    });
    svg+='</svg>';
    const top=[...prod.values()].filter(x=>x.rev>0).sort((a,b)=>b.rev-a.rev).slice(0,8),tm=top.length?top[0].rev:1;
    g('l-body').innerHTML=
    '<div class="ledger"><div><label>Omzet</label><strong>'+rp(omzet)+'</strong><small>'+num(sales.length)+' nota'+(retTotal?' · retur '+rp(retTotal):'')+'</small></div>'+
    '<div><label>Laba kotor</label><strong>'+rp(laba)+'</strong><small>'+(omzet-tax?Math.round(laba/(omzet-tax)*100):0)+'% dari penjualan bersih</small></div>'+
    '<div><label>Piutang tempo</label><strong>'+rp(piutang)+'</strong><small>belum dilunasi (semua waktu)</small></div>'+
    '<div><label>Nilai persediaan</label><strong>'+rp(nilai)+'</strong><small>stok × harga beli</small></div>'+
    '<div><label>Stok menipis</label><strong>'+low.length+'</strong><small>produk di bawah minimum</small></div></div>'+
    '<div class="cols"><section class="card"><h3>Omzet per hari</h3><div class="chartbox">'+svg+'</div></section>'+
    '<section class="card"><h3>Produk terlaris</h3>'+(top.length?'<div class="hbars">'+top.map(x=>'<div class="hb"><span class="t">'+esc(x.name)+'</span><span class="v">'+num(x.qty)+' terjual · '+rp(x.rev)+'</span><div class="track"><i style="width:'+Math.max(2,x.rev/tm*100)+'%"></i></div></div>').join('')+'</div>':'<p class="muted">Belum ada penjualan pada periode ini.</p>')+'</section>'+
    '<section class="card"><h3>Metode pembayaran</h3>'+(Object.keys(meth).length?Object.keys(meth).map(k=>'<div class="rowline"><span>'+esc(PAYL[k]||k)+'</span><b>'+rp(meth[k])+'</b></div>').join(''):'<p class="muted">Belum ada penjualan pada periode ini.</p>')+'</section>'+
    '<section class="card"><h3>Perlu dibeli</h3>'+(low.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Produk</th><th class="num">Stok</th><th class="num">Min</th></tr></thead><tbody>'+low.slice(0,10).map(x=>'<tr><td class="nm"><b>'+esc(x.p.name)+'</b><small>'+esc(x.p.sku)+(supName(x.p.supplierId)?' · '+esc(supName(x.p.supplierId)):'')+'</small></td><td class="num"><span class="stk '+(x.s<=0?'out':'low')+'">'+num(x.s)+'</span></td><td class="num">'+num(x.p.min)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">Semua stok di atas batas minimum.</p>')+'</section></div>';
  }
  g('l-pre').onclick=e=>{const b=e.target.closest('button');if(b){lpre=b.dataset.p;draw()}};
  g('l-exp').onclick=()=>{
    const rows=[['tanggal','no_nota','kasir','pelanggan','metode','sku','produk','jumlah','harga','subtotal','harga_beli']];
    salesIn().sort((a,b)=>a.ts-b.ts).forEach(t=>(t.lines||[]).forEach(l=>rows.push([dayKey(t.ts)+' '+fmtT(t.ts),t.no||'',t.cashier||'',t.customer||'',PAYL[t.method]||t.method,l.sku||'',l.name,l.qty,l.price,l.qty*l.price,l.buy||0])));
    retIn().sort((a,b)=>a.ts-b.ts).forEach(r=>(r.lines||[]).forEach(l=>rows.push([dayKey(r.ts)+' '+fmtT(r.ts),r.no||'',r.by||'',r.customer||'','Retur '+(r.saleNo||''),l.sku||'',l.name,-l.qty,l.price,-l.qty*l.price,l.buy||0])));
    if(rows.length===1){toast('Tidak ada penjualan pada periode ini','warn');return}
    saveFile('penjualan-'+today()+'.csv',toCSV(rows));
  };
  return {update(){draw()}};
};

      $('#r-file',b).onchange=async e=>{

        let d;try{d=JSON.parse(await f.text())}catch(er){$('#r-msg',b).textContent='File bukan JSON yang valid.';$('#r-msg',b).className='hint bad';return}
        if(!d||d.app!=='kasir-sparepart'){$('#r-msg',b).textContent='File ini bukan cadangan aplikasi kasir sparepart.';$('#r-msg',b).className='hint bad';return}
        const items=[];
        ['products','suppliers','trx'].forEach(c=>(d[c]||[]).forEach(x=>{if(x&&x.id)items.push([c,x.id,x])}));
        if(!(await ask('Pulihkan '+num(items.length)+' data dari cadangan?','Pulihkan')))return;
        const m=$('#r-meter',b);m.hidden=false;let fail=0;
        try{if(d.meta)await saveMeta({...META0,...d.meta})}catch(er){fail++}
        await pool(items,async it=>{try{await put(it[0],it[1],it[2])}catch(er){fail++}},4,(dn,n)=>{$('i',m).style.width=Math.round(dn/n*100)+'%'});
        toast(fail?'Selesai dengan '+fail+' kegagalan':'Data berhasil dipulihkan',fail?'warn':'ok');api.close();
      };

  g('m-demo').onclick=async()=>{
    const ids=[...S.products.values()].filter(p=>p.demo).map(p=>p.id),sids=[...S.suppliers.values()].filter(p=>p.demo).map(p=>p.id);
    if(!(await ask('Hapus '+ids.length+' produk contoh dan '+sids.length+' pemasok contoh? Data Anda sendiri tidak ikut terhapus.','Hapus data contoh',true)))return;

      await pool(ids,id=>del('products',id),4);await pool(sids,id=>del('suppliers',id),4);
      toast('Data contoh dihapus','ok');

  function data(){
    const n=S.products.size+S.trx.size+S.suppliers.size+1,cap=25000;
    g('m-data').innerHTML='<div class="rowline" style="padding:0;border:0"><span>Penyimpanan</span><b>'+(S.mode==='cloud'?'Cloud (tersimpan otomatis)':'Lokal (hanya di browser ini)')+'</b></div>'+
      '<div class="rowline" style="padding:0;border:0"><span>Produk · Pemasok · Transaksi</span><b>'+num(S.products.size)+' · '+num(S.suppliers.size)+' · '+num(S.trx.size)+'</b></div>'+

    g('m-staff').innerHTML=L.length?L.map(s=>'<div class="rowline"><div><b>'+esc(s.name)+'</b>'+(SESSION&&SESSION.id===s.id?' <span class="muted sm">(Anda)</span>':'')+'<div class="muted sm">'+esc(ROLEL[s.role]||s.role)+(s.active===false?' · nonaktif':'')+'</div></div><button type="button" class="btn ghost sm" data-sid="'+esc(s.id)+'">Ubah</button></div>').join(''):

    g('m-sadd').textContent=L.length?'+ Tambah staf':'Buat akun pemilik';

/* ================= STAF, PIN, KUNCI ================= */
async function hashPin(pin,salt){
  const s=salt+':'+pin;
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'f'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
let lastAct=Date.now();
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{const m=+S.meta.lockMin||0;if(SESSION&&m>0&&Date.now()-lastAct>m*60000)lockNow()},15000);

function setSession(s){
  SESSION=s;
  try{s?sessionStorage.setItem('kasir-sesi',JSON.stringify(s)):sessionStorage.removeItem('kasir-sesi')}catch(e){}
  lastAct=Date.now();
  if(!s)$('#modal-root').innerHTML='';
  applyLock();chrome();route();
}
function lockNow(){if(locked())setSession(null)}
function lockCheck(){
  if(!ready())return;
  if(SESSION){
    const st=S.staff.get(SESSION.id);
    if(!locked()||!st||st.active===false){SESSION=null;try{sessionStorage.removeItem('kasir-sesi')}catch(e){}}
    else if(st.role!==SESSION.role||st.name!==SESSION.name){SESSION={...SESSION,role:st.role,name:st.name};buildNav()}
  }
  applyLock();
}

const LK={sel:null,pin:'',tries:0,until:0};
function applyLock(){
  const need=ready()&&locked()&&!SESSION,el=$('#lock');
  if(!need){if(el)el.remove();return}
  if(el)return;
  const L=staffList();
  LK.sel=L.length===1?L[0].id:null;LK.pin='';
  const box=document.createElement('div');box.className='lock';box.id='lock';
  box.innerHTML='<div class="lock-box"><div class="brand-mark" style="width:56px;height:56px;font-size:28px">'+esc($('#brandMark').textContent)+'</div><h1>'+esc(S.meta.shopName)+'</h1><p class="muted">Pilih nama Anda, lalu masukkan PIN.</p><div class="who" id="lk-who"></div>'+
    '<div id="lk-pin" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px" hidden><div class="dots" id="lk-dots"></div><div class="hint bad" id="lk-msg" style="min-height:20px"></div>'+
    '<div class="pad" id="lk-pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button type="button" data-k="'+n+'">'+n+'</button>').join('')+'<button type="button" class="sec" data-k="back">Hapus</button><button type="button" data-k="0">0</button><button type="button" class="ok sec" data-k="ok">Masuk</button></div></div></div>';
  document.body.appendChild(box);
  drawLock();
  box.addEventListener('click',e=>{
    const w=e.target.closest('#lk-who button');
    if(w){LK.sel=w.dataset.id;LK.pin='';$('#lk-msg').textContent='';drawLock();return}
    const k=e.target.closest('#lk-pad button');
    if(k)lockKey(k.dataset.k);
  });
}
function drawLock(){
  const who=$('#lk-who');if(!who)return;
  who.innerHTML=staffList().map(s=>'<button type="button" data-id="'+esc(s.id)+'" class="'+(LK.sel===s.id?'on':'')+'"><b>'+esc(s.name)+'</b><small>'+esc(ROLEL[s.role]||'')+'</small></button>').join('');
  $('#lk-pin').hidden=!LK.sel;
  $('#lk-dots').innerHTML=[0,1,2,3,4,5].map(i=>'<i class="'+(i<LK.pin.length?'f':'')+'"></i>').join('');
}
function lockKey(k){
  if(!LK.sel)return;
  if(/^\d$/.test(k)){if(LK.pin.length<6){LK.pin+=k;drawLock()}}
  else if(k==='back'){LK.pin=LK.pin.slice(0,-1);drawLock()}
  else if(k==='ok')lockSubmit();
}
async function lockSubmit(){
  const s=S.staff.get(LK.sel),say=t=>{const m=$('#lk-msg');if(m)m.textContent=t};
  if(!s||LK.pin.length<4){say('PIN minimal 4 angka.');return}
  if(Date.now()<LK.until){say('Terlalu banyak percobaan. Tunggu '+Math.ceil((LK.until-Date.now())/1000)+' detik.');return}
  const h=await hashPin(LK.pin,s.salt||'');
  if(h===s.pin){LK.tries=0;setSession({id:s.id,name:s.name,role:s.role});return}
  LK.tries++;LK.pin='';drawLock();
  if(LK.tries>=5){LK.until=Date.now()+30000;LK.tries=0;say('PIN salah 5 kali. Coba lagi 30 detik lagi.')}else say('PIN salah. Coba lagi.');
}
document.addEventListener('keydown',e=>{
  if(!$('#lock')||!LK.sel)return;
  if(/^\d$/.test(e.key))lockKey(e.key);
  else if(e.key==='Backspace')lockKey('back');
  else if(e.key==='Enter')lockKey('ok');
});

function authorize(min,why){
  if(!locked())return Promise.resolve({id:'',name:cashierName(),role:'pemilik'});
  if(SESSION&&(RANK[SESSION.role]||0)>=min)return Promise.resolve({id:SESSION.id,name:SESSION.name,role:SESSION.role});
  const elig=staffList().filter(s=>(RANK[s.role]||0)>=min);
  return new Promise(res=>{
    let done=false;
    modal({title:'Perlu otorisasi',lock:true,onClose:()=>{if(!done){done=true;res(null)}},
      build:(b,api)=>{
        b.innerHTML='<p>'+esc(why||'Tindakan ini perlu PIN manajer atau pemilik.')+'</p>'+
          '<label class="field"><span>Nama</span><select id="au-who" class="select">'+elig.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+' · '+esc(ROLEL[s.role])+'</option>').join('')+'</select></label>'+
          '<label class="field"><span>PIN</span><input id="au-pin" class="input big" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label><div class="hint bad" id="au-err" hidden></div>';
        $('#au-pin',b).addEventListener('keydown',e=>{if(e.key==='Enter')api.foot.lastChild.click()});
      },
      footer:[{label:'Batal',cls:'ghost',fn:a=>a.close()},{label:'Otorisasi',cls:'primary',fn:async a=>{
        const s=S.staff.get($('#au-who',a.body).value);
        const ok=s&&(await hashPin($('#au-pin',a.body).value,s.salt||''))===s.pin;
        if(ok){done=true;res({id:s.id,name:s.name,role:s.role});a.close()}
        else{const e=$('#au-err',a.body);e.textContent='PIN salah.';e.hidden=false;$('#au-pin',a.body).value='';$('#au-pin',a.body).focus()}
      }}]});
  });
}

function staffEditor(id){
  const old=id?S.staff.get(id):null,P=old||{role:'kasir',active:true};
  const lastOwner=doc=>{ // pastikan masih ada pemilik aktif setelah perubahan ini
    const all=[...S.staff.values()].filter(s=>s.id!==id);
    if(doc)all.push(doc);
    return all.some(s=>s.role==='pemilik'&&s.active!==false);
  };
  modal({title:old?'Ubah staf':'Staf baru',lock:true,build:b=>{
    b.innerHTML='<div class="hint bad" id="st-err" hidden></div>'+
      '<label class="field"><span>Nama</span><input id="st-name" class="input" value="'+esc(P.name||'')+'" autocomplete="off"></label>'+
      '<label class="field"><span>Peran</span><select id="st-role" class="select"><option value="kasir">Kasir</option><option value="manajer">Manajer</option><option value="pemilik">Pemilik</option></select></label>'+
      '<label class="field"><span>'+(old?'PIN baru (kosongkan jika tidak diubah)':'PIN (4 sampai 6 angka)')+'</span><input id="st-pin" class="input" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>'+
      '<label class="check"><input type="checkbox" id="st-act"'+(P.active!==false?' checked':'')+'> Aktif</label>';
    $('#st-role',b).value=P.role;
  },footer:[
    old?{label:'Hapus',cls:'ghost',fn:async a=>{
      if(SESSION&&SESSION.id===id){toast('Akun yang sedang dipakai tidak bisa dihapus','warn');return}
      if(!lastOwner(null)){toast('Harus ada minimal satu pemilik aktif','warn');return}
      if(await ask('Hapus akun '+old.name+'?','Hapus',true)){try{await del('staff',id);toast('Akun dihapus','ok');a.close()}catch(e){toast(msg(e),'bad')}}
    }}:null,
    {label:'Batal',cls:'ghost',fn:a=>a.close()},
    {label:'Simpan',cls:'primary',fn:async(a,bt)=>{
      const g=i=>$('#'+i,a.body),err=m=>{const e=g('st-err');e.textContent=m;e.hidden=false};
      const name=g('st-name').value.trim(),role=g('st-role').value,pin=g('st-pin').value.trim(),active=g('st-act').checked;
      if(!name){err('Nama wajib diisi.');return}
      if([...S.staff.values()].some(s=>s.id!==id&&s.active!==false&&String(s.name).toLowerCase()===name.toLowerCase())){err('Nama itu sudah dipakai staf lain.');return}
      if((!old||pin)&&!/^\d{4,6}$/.test(pin)){err('PIN harus 4 sampai 6 angka.');return}
      const doc={...(old||{}),name,role,active,updated:Date.now()};
      if(pin){doc.salt=uid();doc.pin=await hashPin(pin,doc.salt)}
      if(!lastOwner({...doc,id})){err('Harus ada minimal satu pemilik aktif.');return}
      bt.disabled=true;
      try{await put('staff',id||('u'+uid()),doc);toast('Staf tersimpan','ok');a.close()}
      catch(e){err('Gagal menyimpan: '+msg(e));bt.disabled=false}
    }}
  ].filter(Boolean)});
}
function ownerSetup(){
  modal({title:'Buat akun pemilik',lock:true,build:b=>{
    b.innerHTML='<p>Setelah akun ini dibuat, aplikasi terkunci dan setiap orang harus memasukkan PIN. Anda langsung masuk sebagai pemilik.</p><div class="hint bad" id="ow-err" hidden></div>'+
      '<label class="field"><span>Nama pemilik</span><input id="ow-name" class="input" autocomplete="off"></label>'+
      '<label class="field"><span>PIN (4 sampai 6 angka)</span><input id="ow-pin" class="input" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>'+
      '<label class="field"><span>Ulangi PIN</span><input id="ow-pin2" class="input" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>';
  },footer:[
    {label:'Batal',cls:'ghost',fn:a=>a.close()},
    {label:'Buat akun & kunci',cls:'primary',fn:async(a,bt)=>{
      const g=i=>$('#'+i,a.body),err=m=>{const e=g('ow-err');e.textContent=m;e.hidden=false};
      const name=g('ow-name').value.trim(),pin=g('ow-pin').value.trim();
      if(!name){err('Nama wajib diisi.');return}
      if(!/^\d{4,6}$/.test(pin)){err('PIN harus 4 sampai 6 angka.');return}
      if(pin!==g('ow-pin2').value.trim()){err('Kedua PIN tidak sama.');return}
      bt.disabled=true;
      const id='u'+uid(),salt=uid();
      try{
        const doc={name,role:'pemilik',active:true,salt,pin:await hashPin(pin,salt),created:Date.now()};
        await put('staff',id,doc);
        S.staff.set(id,{id,...doc});
        a.close();toast('Akun pemilik dibuat','ok');
        setSession({id,name,role:'pemilik'});
      }catch(e){err('Gagal menyimpan: '+msg(e));bt.disabled=false}
    }}
  ]});
}

function receiptHTML(s){
  const w=+S.meta.paper===80?'80mm':'58mm';
  return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(s.no)+'</title><style>'+
    '@page{size:'+w+' auto;margin:0}html,body{margin:0;background:#fff}body{width:'+w+';padding:2mm 3mm;box-sizing:border-box}'+
    'pre{margin:0;font:9.5px/1.3 "Courier New",Courier,monospace;color:#000;white-space:pre}'+
    '@media screen{body{margin:12px auto;outline:1px dashed #999}}</style></head><body><pre>'+esc(receiptText(s))+'</pre>'+
    '<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)})</scr'+'ipt></body></html>';
}
function receiptPDF(s){
  const cols=+S.meta.paper===80?48:32,W=cols===48?226.8:164.4,fs=(W-8)/(cols*0.6),lh=fs*1.3;
  const lines=receiptText(s).split('\n').map(l=>l.replace(/[^\x20-\x7E]/g,'?'));
  const H=Math.ceil(lines.length*lh+16);
  const e2=t=>t.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  let cs='BT /F1 '+fs.toFixed(2)+' Tf '+lh.toFixed(2)+' TL 4 '+(H-8-fs).toFixed(2)+' Td\n';
  lines.forEach(l=>{cs+='('+e2(l)+') Tj T*\n'});
  cs+='ET';
  const objs=[
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
    '<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>'
  ];
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  const x=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return out;
}
