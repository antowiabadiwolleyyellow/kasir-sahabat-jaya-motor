<title>Kasir Sahabat Jaya Motor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar rail + workspace on desktop, bottom tab bar on phone. Kasir = katalog produk | struk keranjang. */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#e6eaf0;--line:#d3d9e2;
  --ink:#0f1a2e;--ink2:#46526a;--ink3:#6a768d;
  --amber:#f2b705;--amber-ink:#201700;--amber-text:#7d5300;
  --btn-bg:#0f1a2e;--btn-fg:#ffffff;
  --ok:#17784a;--ok-bg:#dcf2e5;--warn:#8f5700;--warn-bg:#fbebc4;--bad:#b3261e;--bad-bg:#fadedb;
  --series:#2a4a92;--focus:#1f4fd8;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 6px 18px rgba(15,26,46,.07);
  --fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120;--surface:#121b2e;--surface2:#1a2540;--line:#27324d;
    --ink:#e9eef8;--ink2:#a9b4ca;--ink3:#7f8ca8;
    --amber:#f2b705;--amber-ink:#201700;--amber-text:#f4c84a;
    --btn-bg:#f2b705;--btn-fg:#201700;
    --ok:#4cc38a;--ok-bg:#12372a;--warn:#f1b84a;--warn-bg:#3a2d0c;--bad:#ff8a80;--bad-bg:#43191a;
    --series:#8fb0ff;--focus:#8fb0ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120;--surface:#121b2e;--surface2:#1a2540;--line:#27324d;
  --ink:#e9eef8;--ink2:#a9b4ca;--ink3:#7f8ca8;
  --amber:#f2b705;--amber-ink:#201700;--amber-text:#f4c84a;
  --btn-bg:#f2b705;--btn-fg:#201700;
  --ok:#4cc38a;--ok-bg:#12372a;--warn:#f1b84a;--warn-bg:#3a2d0c;--bad:#ff8a80;--bad-bg:#43191a;
  --series:#8fb0ff;--focus:#8fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);
  padding-block:14px 92px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:600;letter-spacing:.01em;text-wrap:balance}
h2{font-size:22px}h3{font-size:19px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink3)}.sm{font-size:13px}.mono{font-family:var(--fm)}
.grow{flex:1;min-width:0}
.only-sm{display:none}
[hidden]{display:none!important}

/* shell */
#app{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1520px;margin:0 auto}
#nav{display:none;flex-direction:column;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 12px;box-shadow:var(--shadow)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:4px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font:700 19px/1 var(--fd);letter-spacing:.04em;box-shadow:inset 0 0 0 2px var(--amber-ink)}
.brand-name{font:600 19px/1.1 var(--fd);overflow-wrap:anywhere}
.brand-sub{font-size:12px;color:var(--ink3)}
#navlinks{display:flex;flex-direction:column;gap:2px}
.navlink{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:500;border-left:3px solid transparent}
.navlink:hover{background:var(--surface2);color:var(--ink)}
.navlink.on{background:var(--surface2);color:var(--ink);border-left-color:var(--amber);font-weight:600}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--ink3);text-decoration:none;font-size:11px;font-weight:500;border-radius:6px}
#tabbar a.on{color:var(--ink);background:var(--surface2);box-shadow:inset 0 2px 0 var(--amber)}
#topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
#topbar h1{font-size:30px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
@media(min-width:900px){
  body{padding-bottom:24px;padding-top:18px}
  #app{grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
  #nav{display:flex;position:sticky;top:18px}
  #tabbar{display:none}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 16px;border-radius:6px;border:1px solid transparent;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.xl{min-height:56px;font-size:20px;font-family:var(--fd);letter-spacing:.04em;text-transform:uppercase;width:100%}
.icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ink3);font-size:20px;line-height:1;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.input,.select,textarea.input{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.input.big{min-height:48px;font-size:17px}
.input.sm{min-height:34px;padding:4px 8px}
.input::placeholder{color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--btn-bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;font-weight:600;color:var(--ink2);min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--btn-bg);color:var(--btn-fg)}
.seg.sm button{padding:6px 12px;min-height:40px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.sku{display:inline-block;font:500 12px/1 var(--fm);letter-spacing:.04em;padding:3px 6px;border-radius:3px;border:1px solid var(--ink3);box-shadow:inset 0 0 0 1px var(--surface),inset 0 0 0 2px var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>h3{margin-bottom:-4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .select{width:auto;min-width:150px}
.toolbar.sub{margin-top:-4px}
.searchbar{position:relative;flex:1;min-width:220px;display:flex;align-items:center}
.searchbar .input{padding-right:64px}
.searchbar kbd{position:absolute;right:10px;font:500 11px var(--fm);color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:2px 5px;background:var(--surface2)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .span2{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:13px;color:var(--ink3)}
.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.split{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card .tablewrap{border-radius:6px}
.table{width:100%;border-collapse:collapse}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr[data-id]{cursor:pointer}
.table tbody tr[data-id]:hover td{background:var(--surface2)}
.table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table th.num{text-align:right}
.table td small{display:block;color:var(--ink3);font-size:12.5px}
.table tr.off td{opacity:.5}
.table tfoot td{font-weight:600;background:var(--surface2)}
.nm b{font-weight:600}
.stk{font-weight:600;font-variant-numeric:tabular-nums}
.stk.low{color:var(--warn)}.stk.out{color:var(--bad)}
@media(max-width:700px){.hide-sm{display:none}}

/* empty / loading */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:48px 16px;color:var(--ink2)}
.empty h3{color:var(--ink)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* POS */
.pos{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pos-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-weight:500;color:var(--ink2);min-height:34px}
.chips button.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:128px;align-items:flex-start}
.item:hover{border-color:var(--ink3)}
.item:active{transform:translateY(1px)}
.item:disabled{opacity:.5;cursor:not-allowed}
.item .in{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.item .ip{font:600 21px/1 var(--fd);letter-spacing:.01em}
.item .is{font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pos-cart{display:none;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.pos-cart.show{display:flex;position:fixed;z-index:30;left:0;right:0;top:0;bottom:0;border-radius:0;overflow:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(70px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cart-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cart-tools{display:flex;gap:6px;flex-wrap:wrap}
.cart-lines{display:flex;flex-direction:column;border-top:1px dashed var(--ink3);border-bottom:1px dashed var(--ink3);min-height:72px}
.cart-empty{padding:22px 8px;text-align:center;color:var(--ink3)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.l-name{font-weight:600;line-height:1.25}
.l-sub{font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.l-total{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:78px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stepper button{width:34px;height:36px;border:0;background:var(--surface2);font-size:18px;font-weight:600}
.stepper input{width:44px;height:36px;border:0;text-align:center;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.cart-opts{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.sums{margin:0;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.sums div{display:flex;justify-content:space-between;color:var(--ink2)}
.sums dt,.sums dd{margin:0}
.totalbox{display:flex;justify-content:space-between;align-items:baseline;background:var(--amber);color:var(--amber-ink);padding:10px 14px;border-radius:6px}
.totalbox span{font:600 15px var(--fd);letter-spacing:.14em}
.totalbox strong{font:700 34px/1.05 var(--fd);font-variant-numeric:tabular-nums}
.seg.pay button{font-size:14px;padding:8px 4px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-weight:600;font-size:13px;min-height:36px;font-variant-numeric:tabular-nums}
.change{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;color:var(--ink2)}
.change strong{font:600 24px var(--fd);color:var(--ink)}
.cartbar{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:8px;padding:12px 16px;font-weight:600;box-shadow:var(--shadow)}
.cartbar b{font:700 20px var(--fd);font-variant-numeric:tabular-nums}
@media(min-width:900px){
  .pos{grid-template-columns:minmax(0,1fr) 390px;align-items:start}
  .pos-cart{display:flex;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
  .cartbar{display:none}
}
@media(max-width:899px){.only-sm{display:inline-flex}}

/* suggestions (picker) */
.pickwrap{position:relative}
.sugs{position:absolute;z-index:15;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.sugg{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;min-height:44px}
.sugg:last-child{border-bottom:0}
.sugg:hover{background:var(--surface2)}
.sugg .sn{flex:1;min-width:0;font-weight:500}
.sugg small{color:var(--ink3)}
.pad{padding:12px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.foot .tot{font-size:15px;color:var(--ink2)}
.foot .tot b{font:700 26px var(--fd);color:var(--ink);margin-left:6px}

/* ledger + charts */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px;overflow:hidden}
.ledger>div{padding:14px 16px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.ledger label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.ledger strong{display:block;font:700 30px/1.15 var(--fd);font-variant-numeric:tabular-nums;margin-top:2px}
.ledger small{color:var(--ink3);font-size:12.5px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:420px;height:auto}
.ax{fill:var(--ink3);font:11px var(--fb)}
.grid-l{stroke:var(--line);stroke-width:1}
.bar{fill:var(--series)}.bar.now{fill:var(--amber)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.hb .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13.5px}
.hb .track{grid-column:1/-1;height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--series)}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* modal + toast */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,13,25,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0;display:flex;flex-direction:column}
.modal.wide{max-width:760px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;gap:8px}
.modal-h h2{font-size:24px;overflow-wrap:anywhere}
.modal-b{padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.lead{font-size:16px}
pre.receipt{margin:0;background:#fff;color:#111;border:1px dashed #888;border-radius:2px;padding:14px;font:500 12.5px/1.45 var(--fm);overflow-x:auto;white-space:pre}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast-item{background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;border-radius:6px;font-weight:500;box-shadow:var(--shadow);transition:opacity .3s}
.toast-item.ok{background:var(--ok);color:#fff}.toast-item.warn{background:var(--amber);color:var(--amber-ink)}.toast-item.bad{background:var(--bad);color:#fff}
.toast-item.out{opacity:0}
@media(min-width:900px){#toast{bottom:24px}}
.meter{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--series)}
.stack{display:flex;flex-direction:column;gap:12px}
.rowline{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

<script>
(()=>{'use strict';
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=n=>Math.round(+n||0).toLocaleString('id-ID');
const rp=n=>'Rp '+num(n);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dayKey(Date.now());
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtD=ts=>{const d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const fmtT=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDT=ts=>fmtD(ts)+', '+fmtT(ts);
const startOfDay=k=>new Date(k+'T00:00:00').getTime();
const endOfDay=k=>new Date(k+'T23:59:59.999').getTime();
const msg=e=>(e&&e.code==='quota_exceeded')?'Kapasitas data penuh. Hapus data lama dulu.':((e&&e.message)||String(e));
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const digits=v=>+String(v==null?'':v).replace(/\D/g,'')||0;
const val=el=>digits(el.value);
const toNum=v=>{
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=String(v==null?'':v).replace(/rp/ig,'').replace(/\s/g,'');
  if(!s)return 0;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  else s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?n:0;
};
function money(el,cb){
  el.inputMode='numeric';
  el.addEventListener('input',()=>{const d=String(el.value).replace(/\D/g,'');el.value=d?Number(d).toLocaleString('id-ID'):'';cb&&cb(d?+d:0)});
}
const setMoney=(el,n)=>{el.value=n?Number(n).toLocaleString('id-ID'):''};
const pool=async(items,fn,n,onProg)=>{
  let i=0,done=0;
  const w=async()=>{while(i<items.length){const it=items[i++];await fn(it);done++;onProg&&onProg(done,items.length)}};
  await Promise.all(Array.from({length:Math.min(n||4,items.length)},w));
};
const ICON={
  kasir:'<path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19 8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  produk:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
  stok:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 16.5 9 5 9-5"/>',

  laporan:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  pengaturan:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  cari:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>'
};

/* ================= toast / modal / files ================= */
function toast(m,kind){
  const el=document.createElement('div');el.className='toast-item '+(kind||'');el.textContent=m;$('#toast').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},kind==='bad'?5200:3000);
}
function modal(o){
  const back=document.createElement('div');back.className='backdrop';
  const box=document.createElement('div');box.className='modal'+(o.wide?' wide':'');
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',o.title||'Dialog');
  box.innerHTML='<div class="modal-h"><h2>'+esc(o.title||'')+'</h2><button type="button" class="icon-btn" data-x aria-label="Tutup">×</button></div><div class="modal-b"></div><div class="modal-f"></div>';
  back.appendChild(box);$('#modal-root').appendChild(back);
  const onKey=e=>{if(e.key==='Escape'&&!o.lock)api.close()};
  const api={el:box,body:$('.modal-b',box),foot:$('.modal-f',box),close(){document.removeEventListener('keydown',onKey);back.remove();o.onClose&&o.onClose()}};
  document.addEventListener('keydown',onKey);
  $('[data-x]',box).onclick=()=>api.close();
  if(!o.lock)back.addEventListener('mousedown',e=>{if(e.target===back)api.close()});
  o.build&&o.build(api.body,api);
  (o.footer||[]).forEach(b=>{
    const bt=document.createElement('button');bt.type='button';bt.className='btn '+(b.cls||'');bt.textContent=b.label;
    bt.onclick=()=>b.fn(api,bt);api.foot.appendChild(bt);
  });
  if(!(o.footer&&o.footer.length))api.foot.remove();
  setTimeout(()=>{const f=$('input:not([type=hidden]):not([type=file]),select,textarea',api.body);f&&f.focus()},30);
  return api;
}
function ask(text,ok,danger){
  return new Promise(res=>{
    let done=false;
    modal({title:'Konfirmasi',build:b=>{b.innerHTML='<p class="lead">'+esc(text)+'</p>'},
      onClose:()=>{if(!done){done=true;res(false)}},
      footer:[{label:'Batal',cls:'ghost',fn:a=>a.close()},{label:ok||'Ya',cls:danger?'danger':'primary',fn:a=>{done=true;res(true);a.close()}}]});
  });
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Tersalin','ok')}
  catch(e){modal({title:'Salin teks',build:b=>{b.innerHTML='<textarea class="input mono" rows="12" readonly></textarea>';const ta=$('textarea',b);ta.value=t;setTimeout(()=>ta.select(),50)}})}
}
async function saveFile(filename,data){
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename,data});toast('File siap: '+filename,'ok')}
    catch(e){if(e&&e.code==='declined')return;toast('Gagal menyimpan file: '+msg(e),'bad')}
    return;
  }
  modal({title:filename,wide:true,build:b=>{
    b.innerHTML='<p class="muted">Penyimpanan file tidak tersedia di tampilan ini. Salin isi berikut ke sebuah file.</p><textarea class="input mono" rows="14" readonly></textarea>';
    const ta=$('textarea',b);ta.value=String(data);setTimeout(()=>ta.select(),50);
  }});
}
const csvCell=v=>{const s=String(v==null?'':v);return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=first.split(';').length>first.split(',').length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
const wrap=(t,w)=>{const out=[];let l='';String(t).split(/\s+/).forEach(x=>{if((l+' '+x).trim().length>w){if(l)out.push(l);l=x}else l=(l+' '+x).trim()});if(l)out.push(l);return out};

/* ================= store ================= */
const META0={shopName:'Sahabat Jaya Motor',address:'',phone:'',footer:'Terima kasih atas kunjungan Anda.',taxRate:0,paper:58,allowNegative:false,lowDefault:3,lockMin:10};
const S={products:new Map(),trx:new Map(),suppliers:new Map(),staff:new Map(),meta:{...META0},stock:new Map(),mode:'loading',loaded:{},err:null,slow:false};
const COLL={products:S.products,trx:S.trx,suppliers:S.suppliers,staff:S.staff};
const LS='kasir-sparepart-data-v1';
let DB=null,cur=null,SESSION=null;
const VIEWS={};
const saveLocal=debounce(()=>lsSet(LS,{products:[...S.products.values()],trx:[...S.trx.values()],suppliers:[...S.suppliers.values()],staff:[...S.staff.values()],meta:S.meta}),250);
const clean=o=>JSON.parse(JSON.stringify(o));
async function put(c,id,data){
  const doc=clean(data);delete doc.id;
  if(DB)await DB.collection(c).doc(id).set(doc);
  else{COLL[c].set(id,{id,...doc});saveLocal();changed()}
}
async function patch(c,id,f){
  const fields=clean(f);
  if(DB)await DB.collection(c).doc(id).update(fields);
  else{const o=COLL[c].get(id);if(o)COLL[c].set(id,{...o,...fields});saveLocal();changed()}
}
async function del(c,id){
  if(DB)await DB.collection(c).doc(id).delete();
  else{COLL[c].delete(id);saveLocal();changed()}
}
async function saveMeta(m){
  const doc=clean(m);
  if(DB)await DB.doc('meta/config').set(doc);
  else{S.meta={...META0,...doc};saveLocal();changed()}
}
const ready=()=>S.mode!=='loading'&&['products','trx','suppliers','staff','meta'].every(k=>S.loaded[k]);
function recompute(){
  const st=new Map();
  for(const p of S.products.values())st.set(p.id,+p.opening||0);
  const add=(id,n)=>st.set(id,(st.get(id)||0)+n);
  for(const t of S.trx.values()){
    if(t.voided)continue;
    const L=t.lines||[];
    if(t.type==='sale')L.forEach(l=>add(l.pid,-(+l.qty||0)));
    else if(t.type==='in'||t.type==='return')L.forEach(l=>add(l.pid,+l.qty||0));
    else if(t.type==='adjust')L.forEach(l=>add(l.pid,+l.delta||0));
  }
  S.stock=st;
}
const stockOf=p=>S.stock.get(p.id)||0;
const prodList=()=>[...S.products.values()].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'id'));
const activeProds=()=>prodList().filter(p=>p.active!==false);
const supName=id=>(S.suppliers.get(id)||{}).name||'';
const cats=()=>[...new Set(prodList().map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
const HC=new WeakMap();
const hay=p=>{let h=HC.get(p);if(!h){h=[p.sku,p.barcode,p.name,p.brand,p.category,p.compat,p.oem,p.rack].join(' ').toLowerCase();HC.set(p,h)}return h};
const matchQ=(p,q)=>{const h=hay(p);return q.toLowerCase().split(/\s+/).filter(Boolean).every(x=>h.includes(x))};
const exactMatch=(list,q)=>{q=q.trim().toLowerCase();return list.find(p=>(p.barcode&&String(p.barcode).toLowerCase()===q)||String(p.sku||'').toLowerCase()===q)};
const RANK={kasir:1,manajer:2,pemilik:3},ROLEL={pemilik:'Pemilik',manajer:'Manajer',kasir:'Kasir'};
const staffList=()=>[...S.staff.values()].filter(s=>s.active!==false).sort((a,b)=>(RANK[b.role]||0)-(RANK[a.role]||0)||String(a.name).localeCompare(String(b.name),'id'));
const locked=()=>staffList().length>0;
const eff=()=>!locked()?3:(SESSION?(RANK[SESSION.role]||0):0);
const PAGE_MIN={kasir:1,produk:1,riwayat:1,stok:2,laporan:2,pengaturan:3};
const cashierName=()=>SESSION?SESSION.name:(lsGet('kasir-nama','')||'Kasir');
const cashierId=()=>SESSION?SESSION.id:'';
const PAYL={cash:'Tunai',transfer:'Transfer',qris:'QRIS',tempo:'Tempo',split:'Campuran',piutang:'Kurangi piutang'};
const payParts=t=>t.method==='split'?(t.pays||[]):[{m:t.method,amt:+t.total||0}];
const returnsOf=id=>[...S.trx.values()].filter(r=>r.type==='return'&&r.saleId===id&&!r.voided);
const returnedQty=id=>{const m=new Map();returnsOf(id).forEach(r=>(r.lines||[]).forEach(l=>m.set(l.pid,(m.get(l.pid)||0)+(+l.qty||0))));return m};

const changed=debounce(()=>{
  recompute();lockCheck();chrome();
  if(ready()&&!cur&&eff()>0)route();else if(cur&&cur.update)cur.update();
},40);

function startSubs(){
  const onErr=e=>{S.err=e;chrome();toast('Gagal memuat data: '+msg(e),'bad')};
  for(const name of ['products','trx','suppliers','staff']){
    const map=COLL[name];
    DB.collection(name).onSnapshot(snap=>{
      map.clear();
      for(const d of snap.docs)map.set(d.id,{id:d.id,...d.data()});
      S.loaded[name]=true;changed();
    },onErr);
  }
  DB.doc('meta/config').onSnapshot(s=>{
    S.meta={...META0,...(s.exists?s.data():{})};S.loaded.meta=true;changed();
  },onErr);
}
async function boot(){
  try{const s=JSON.parse(sessionStorage.getItem('kasir-sesi')||'null');if(s&&s.id)SESSION=s}catch(e){}
  buildNav();chrome();route();
  $('#lockbtn').onclick=()=>lockNow();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    DB=db;S.mode='cloud';startSubs();
    setTimeout(()=>{if(!ready()){S.slow=true;chrome()}},10000);
  }else{
    S.mode='local';
    const d=lsGet(LS,null);
    if(d){
      (d.products||[]).forEach(p=>S.products.set(p.id,p));
      (d.trx||[]).forEach(p=>S.trx.set(p.id,p));
      (d.suppliers||[]).forEach(p=>S.suppliers.set(p.id,p));
      (d.staff||[]).forEach(p=>S.staff.set(p.id,p));
      S.meta={...META0,...(d.meta||{})};
    }
    S.loaded={products:1,trx:1,suppliers:1,staff:1,meta:1};
    changed();
  }
}
function chrome(){
  const nm=S.meta.shopName||'Sahabat Jaya Motor';
  $('#brandName').textContent=nm;
  $('#brandMark').textContent=nm.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'SP';
  const who=$('#whoami'),lb=$('#lockbtn');
  if(SESSION){who.hidden=false;who.className='chip';who.textContent=SESSION.name+' · '+(ROLEL[SESSION.role]||'');lb.hidden=false}
  else{who.hidden=true;lb.hidden=true}
  const st=$('#status');let t,c;
  if(S.err){t='Gagal memuat data';c='bad'}
  else if(S.mode==='loading'){t='Memuat…';c='warn'}
  else if(S.mode==='local'){t='Mode lokal · data di browser ini';c='warn'}
  else if(!ready()&&S.slow){t='Belum tersambung ke penyimpanan';c='warn'}
  else{t='Tersimpan otomatis';c='ok'}
  st.className='chip '+c;st.textContent=t;
}

/* ================= nav + router ================= */
const NAV=[['kasir','Kasir'],['produk','Produk'],['stok','Stok'],['riwayat','Riwayat'],['laporan','Laporan'],['pengaturan','Pengaturan']];
const TITLES={kasir:'Kasir',produk:'Produk & SKU',stok:'Stok & gudang',riwayat:'Riwayat penjualan',laporan:'Laporan',pengaturan:'Pengaturan'};
function buildNav(){
  const L=NAV.filter(n=>PAGE_MIN[n[0]]<=Math.max(1,eff()));
  $('#navlinks').innerHTML=L.map(n=>'<a class="navlink" href="#'+n[0]+'" data-n="'+n[0]+'">'+ic(n[0])+'<span>'+n[1]+'</span></a>').join('');
  $('#tabbar').innerHTML=L.map(n=>'<a href="#'+n[0]+'" data-n="'+n[0]+'">'+ic(n[0])+'<span>'+n[1]+'</span></a>').join('');
}
function route(){
  buildNav();
  const h=(location.hash||'').replace('#','');
  const name=(VIEWS[h]&&PAGE_MIN[h]<=eff())?h:'kasir';
  $$('#navlinks a,#tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.n===name));
  $('#title').textContent=TITLES[name];
  const root=$('#view');
  if(cur&&cur.destroy)cur.destroy();
  cur=null;root.innerHTML='';
  if(!ready()){root.innerHTML='<div class="empty"><div class="spin"></div><p>Memuat data toko…</p></div>';return}
  if(eff()===0)return;   // menunggu login
  cur=VIEWS[name](root);cur.update();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ================= shared pieces ================= */
function picker(input,list,onPick){
  const render=()=>{
    const q=input.value.trim();
    if(!q){list.innerHTML='';list.hidden=true;return}
    const r=prodList().filter(p=>p.active!==false&&matchQ(p,q)).slice(0,8);
    list.innerHTML=r.map(p=>'<button type="button" class="sugg" data-id="'+esc(p.id)+'"><span class="sku">'+esc(p.sku)+'</span><span class="sn">'+esc(p.name)+'</span><small>'+(p.service?'Jasa':'stok '+num(stockOf(p)))+'</small></button>').join('')||'<div class="muted pad">Produk tidak ditemukan</div>';
    list.hidden=false;
  };
  const pick=p=>{input.value='';list.innerHTML='';list.hidden=true;onPick(p);input.focus()};
  input.addEventListener('input',render);
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const q=input.value.trim();if(!q)return;
      const all=prodList().filter(p=>p.active!==false);
      const ex=exactMatch(all,q);
      const r=ex?[ex]:all.filter(p=>matchQ(p,q));
      if(r.length===1)pick(r[0]);else if(r.length>1)render();else toast('Produk tidak ditemukan','warn');
    }
    if(e.key==='Escape')list.hidden=true;
  });
  input.addEventListener('blur',()=>setTimeout(()=>{list.hidden=true},180));
  list.addEventListener('mousedown',e=>e.preventDefault());
  list.addEventListener('click',e=>{const b=e.target.closest('.sugg');if(b){const p=S.products.get(b.dataset.id);if(p)pick(p)}});
}
function stockBadge(p){
  if(p.service)return '<span class="badge">Jasa</span>';
  const s=stockOf(p),min=+p.min||0;
  const cls=s<=0?'out':(s<=min?'low':'');
  return '<span class="stk '+cls+'">'+num(s)+'</span> <small style="display:inline">'+esc(p.unit||'')+'</small>'+(s<=0?' <span class="badge bad">Habis</span>':(s<=min?' <span class="badge warn">Menipis</span>':''));
}
const catEmpty=(icon,title,text,btn)=>'<div class="empty"><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(btn||'')+'</div>';

/* ================= KASIR ================= */
const cart={lines:[],disc:0,dtype:'rp',customer:'',mode:'retail',method:'cash',cash:0,sp:{cash:0,transfer:0,qris:0}};
let held=lsGet('kasir-held',[]);
let kq='',kcat='',klimit=60;

function cartLines(){
  const out=[];
  for(const l of cart.lines){
    const p=S.products.get(l.pid);if(!p)continue;
    const price=(cart.mode==='wholesale'&&+p.wholesale>0)?+p.wholesale:(+p.sell||0);
    out.push({p,qty:l.qty,price});
  }
  return out;
}
function totals(){
  const L=cartLines();let sub=0;L.forEach(x=>sub+=x.price*x.qty);
  const disc=cart.dtype==='pct'?Math.round(sub*Math.min(cart.disc,100)/100):Math.min(cart.disc,sub);
  const after=sub-disc;
  const tax=Math.round(after*(+S.meta.taxRate||0)/100);
  return {sub,disc,tax,total:after+tax,count:L.reduce((a,x)=>a+x.qty,0)};
}
function quickAmounts(t){
  const s=new Set([t]);
  [5000,10000,20000,50000,100000].forEach(u=>{const v=Math.ceil(t/u)*u;if(v>=t)s.add(v)});
  return [...s].sort((a,b)=>a-b).slice(0,4);
}
function nextNo(ts){
  const d=new Date(ts);
  const key=String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate());
  let n=0;
  for(const t of S.trx.values())if(t.type==='sale'&&t.no&&t.no.indexOf('INV-'+key)===0)n++;
  return 'INV-'+key+'-'+String(n+1).padStart(4,'0');
}
function receiptText(s){
  const W=+S.meta.paper===80?48:32,line='-'.repeat(W);
  const c=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t;
  const two=(l,r)=>{l=String(l);r=String(r);const sp=W-l.length-r.length;return sp>0?l+' '.repeat(sp)+r:l.slice(0,Math.max(0,W-r.length-1))+' '+r};
  const o=[];
  wrap(S.meta.shopName||'Toko',W).forEach(x=>o.push(c(x)));
  if(S.meta.address)wrap(S.meta.address,W).forEach(x=>o.push(c(x)));
  if(S.meta.phone)o.push(c('Telp '+S.meta.phone));
  o.push(line);
  o.push(two(s.no,fmtD(s.ts)));
  o.push(two('Kasir: '+(s.cashier||'-'),fmtT(s.ts)));
  if(s.customer)o.push('Pelanggan: '+s.customer);
  o.push(line);
  (s.lines||[]).forEach(l=>{
    wrap(l.name,W).forEach(x=>o.push(x));
    o.push(two('  '+l.qty+' x '+num(l.price),num(l.qty*l.price)));
  });
  o.push(line);
  o.push(two('Subtotal',num(s.sub)));
  if(s.disc)o.push(two('Diskon','-'+num(s.disc)));
  if(s.tax)o.push(two('PPN '+(+S.meta.taxRate||0)+'%',num(s.tax)));
  o.push(two('TOTAL',num(s.total)));
  if(s.method==='tempo')o.push(two('Tempo','belum dibayar'));
  else if(s.method==='split'&&s.sp){
    if(s.sp.cash)o.push(two('Tunai',num(s.sp.cash)));
    if(s.sp.transfer)o.push(two('Transfer',num(s.sp.transfer)));
    if(s.sp.qris)o.push(two('QRIS',num(s.sp.qris)));
    if(s.change)o.push(two('Kembali',num(s.change)));
  }
  else{o.push(two('Bayar ('+(PAYL[s.method]||s.method)+')',num(s.paid)));if(s.change)o.push(two('Kembali',num(s.change)))}
  o.push(line);
  wrap(S.meta.footer||'',W).forEach(x=>o.push(c(x)));
  return o.join('\n');
}
function showReceipt(s){
  const txt=receiptText(s);
  modal({title:'Struk '+s.no,build:b=>{
    b.innerHTML='<pre class="receipt">'+esc(txt)+'</pre><p class="muted sm">Cetak: unduh file struk, buka file itu, lalu jendela cetak muncul otomatis. Pilih printer thermal Anda (kertas '+(+S.meta.paper===80?'80':'58')+' mm). Atau unduh PDF dan cetak dari aplikasi printer.</p>';
  },footer:[
    {label:'Salin',cls:'ghost',fn:()=>copyText(txt)},
    {label:'Unduh PDF',cls:'ghost',fn:()=>saveFile(s.no+'.pdf',receiptPDF(s))},
    {label:'Cetak',cls:'amber',fn:()=>saveFile(s.no+'.html',receiptHTML(s))},
    {label:'Selesai',cls:'primary',fn:a=>a.close()}
  ]});
}

    '<div id="kcashbox"><label class="field"><span>Uang diterima</span><input id="kcash" class="input big" placeholder="0"></label><div class="quick" id="kquick"></div><div class="change"><span>Kembali</span><strong id="kchg">Rp 0</strong></div></div>'+
    '<p class="hint" id="ktempohint" hidden>Transaksi tempo dicatat sebagai piutang pelanggan. Pelunasan dicatat di menu Riwayat.</p>'+

   '</aside>'+
   '<button type="button" class="cartbar" id="kbar"></button>'+
  '</div>';
  const g=id=>$('#'+id,root);
  const q=g('kq'),cust=g('kcust'),disc=g('kdisc'),cashI=g('kcash');
  q.value=kq;cust.value=cart.customer;setMoney(disc,cart.disc);setMoney(cashI,cart.cash);
  money(disc,v=>{cart.disc=v;sums()});
  money(cashI,v=>{cart.cash=v;sums()});
  const spI={cash:g('ksp-cash'),transfer:g('ksp-transfer'),qris:g('ksp-qris')};
  Object.keys(spI).forEach(k=>{setMoney(spI[k],cart.sp[k]);money(spI[k],v=>{cart.sp[k]=v;sums()})});
  cust.addEventListener('input',()=>{cart.customer=cust.value});

  function results(){return activeProds().filter(p=>!kcat||p.category===kcat).filter(p=>!kq.trim()||matchQ(p,kq))}
  function chips(){
    const cs=cats();
    g('kchips').innerHTML='<button type="button" data-c="" class="'+(!kcat?'on':'')+'">Semua</button>'+cs.map(c=>'<button type="button" data-c="'+esc(c)+'" class="'+(kcat===c?'on':'')+'">'+esc(c)+'</button>').join('');
  }
  function grid(){
    const all=results();
    if(!S.products.size){
      g('kgrid').innerHTML='';
      g('kmore').innerHTML=catEmpty('','Belum ada produk','Tambahkan produk di menu Produk, atau impor daftar produk dari CSV.','<a class="btn primary" href="#produk">Buka menu Produk</a>');
      return;
    }
    const shown=all.slice(0,klimit);
    g('kgrid').innerHTML=shown.map(p=>{
      const s=stockOf(p),blocked=!p.service&&s<=0&&!S.meta.allowNegative;
      const price=(cart.mode==='wholesale'&&+p.wholesale>0)?+p.wholesale:(+p.sell||0);
      const low=!p.service&&s<=(+p.min||0);
      return '<button type="button" class="item" data-id="'+esc(p.id)+'"'+(blocked?' disabled':'')+'>'+
        '<span class="sku">'+esc(p.sku)+'</span><span class="in">'+esc(p.name)+'</span>'+
        '<span class="ip">'+rp(price)+'</span>'+
        '<span class="is">'+(p.service?'Jasa':(s<=0?'<span class="badge bad">Habis</span>':'<span class="'+(low?'stk low':'')+'">Stok '+num(s)+'</span>'))+(p.rack?'<span>· Rak '+esc(p.rack)+'</span>':'')+'</span></button>';
    }).join('');
    g('kmore').innerHTML=all.length===0?catEmpty('','Produk tidak ditemukan','Coba kata kunci lain atau pilih kategori Semua.'):
      (all.length>shown.length?'<button type="button" class="btn ghost" id="kmorebtn">Tampilkan lebih banyak ('+(all.length-shown.length)+' lagi)</button>':'');
  }
  function lines(){
    const L=cartLines();
    if(!L.length){g('klines').innerHTML='<div class="cart-empty">Keranjang kosong. Scan barcode atau pilih produk.</div>';return}
    g('klines').innerHTML=L.map(x=>
      '<div class="line" data-pid="'+esc(x.p.id)+'"><div><div class="l-name">'+esc(x.p.name)+'</div><div class="l-sub"><span class="sku">'+esc(x.p.sku)+'</span><span>@ '+num(x.price)+'</span></div></div>'+
      '<div class="stepper"><button type="button" data-a="dec" aria-label="Kurangi">−</button><input data-a="qty" inputmode="numeric" value="'+x.qty+'" aria-label="Jumlah"><button type="button" data-a="inc" aria-label="Tambah">+</button></div>'+
      '<div class="l-total">'+num(x.price*x.qty)+'</div></div>').join('');
  }
  function sums(){
    const t=totals(),has=cartLines().length>0;
    g('ksub').textContent=rp(t.sub);
    g('kdiscrow').hidden=!t.disc;g('kdiscv').textContent='-'+rp(t.disc);
    g('ktaxrow').hidden=!t.tax;g('ktaxl').textContent='PPN '+(+S.meta.taxRate||0)+'%';g('ktaxv').textContent=rp(t.tax);
    g('ktotal').textContent=rp(t.total);
    $$('#kmode button',root).forEach(b=>b.classList.toggle('on',b.dataset.m===cart.mode));
    $$('#kdt button',root).forEach(b=>b.classList.toggle('on',b.dataset.t===cart.dtype));
    $$('#kmeth button',root).forEach(b=>b.classList.toggle('on',b.dataset.p===cart.method));
    const cash=cart.method==='cash';
    g('kcashbox').hidden=!cash;g('ktempohint').hidden=cart.method!=='tempo';
    const isSp=cart.method==='split';g('ksplit').hidden=!isSp;
    if(isSp){
      const sp=cart.sp,got=sp.cash+sp.transfer+sp.qris,diff=got-t.total;
      g('ksp-l').textContent=diff<0?'Kurang':'Kembali';
      g('ksp-v').textContent=rp(Math.abs(diff));
      g('ksp-v').style.color=diff<0&&has?'var(--bad)':'';
    }
    g('kquick').innerHTML=has?quickAmounts(t.total).map((v,i)=>'<button type="button" data-v="'+v+'">'+(i===0?'Uang pas':num(v))+'</button>').join(''):'';
    const chg=cart.cash-t.total;
    g('kchg').textContent=rp(Math.max(0,chg));
    g('kchg').style.color=cash&&has&&cart.cash>0&&chg<0?'var(--bad)':'';
    const pay=g('kpay');pay.disabled=!has;pay.textContent=has?'Bayar · '+rp(t.total):'Bayar';
    g('kbar').innerHTML='<span>Keranjang · '+t.count+' item</span><b>'+rp(t.total)+'</b>';
    g('kbar').hidden=false;
    g('kheldn').textContent=held.length?'('+held.length+')':'';
  }
  function addTo(p,qty){
    qty=qty||1;
    const ln=cart.lines.find(l=>l.pid===p.id);
    const want=(ln?ln.qty:0)+qty;
    if(!p.service&&!S.meta.allowNegative&&want>stockOf(p)){toast('Stok '+p.name+' tersisa '+num(stockOf(p)),'warn');return}
    if(ln)ln.qty=want;else cart.lines.push({pid:p.id,qty});
    lines();sums();
  }
  function reset(){
    cart.lines=[];cart.disc=0;cart.dtype='rp';cart.customer='';cart.mode='retail';cart.method='cash';cart.cash=0;cart.sp={cash:0,transfer:0,qris:0};
    cust.value='';disc.value='';cashI.value='';Object.keys(spI).forEach(k=>{spI[k].value=''});lines();grid();sums();
  }
  function hold(){
    if(!cart.lines.length){toast('Keranjang kosong');return}
    held.push({id:uid(),ts:Date.now(),lines:cart.lines.map(l=>({...l})),customer:cart.customer,mode:cart.mode,disc:cart.disc,dtype:cart.dtype});
    lsSet('kasir-held',held);reset();toast('Transaksi ditahan','ok');
  }
  function recall(){
    if(!held.length){toast('Tidak ada transaksi yang ditahan');return}
    modal({title:'Transaksi ditahan',build:(b,api)=>{
      const draw=()=>{
        b.innerHTML=held.length?held.map(h=>'<div class="rowline"><div><b>'+(h.customer?esc(h.customer):'Tanpa nama')+'</b><div class="muted sm">'+fmtT(h.ts)+' · '+h.lines.reduce((a,l)=>a+l.qty,0)+' item</div></div><div><button type="button" class="btn primary sm" data-load="'+h.id+'">Lanjutkan</button> <button type="button" class="icon-btn" data-drop="'+h.id+'" aria-label="Hapus">×</button></div></div>').join(''):'<p class="muted">Tidak ada transaksi ditahan.</p>';
      };
      draw();
      b.onclick=e=>{
        const ld=e.target.closest('[data-load]'),dr=e.target.closest('[data-drop]');
        if(ld){
          const h=held.find(x=>x.id===ld.dataset.load);if(!h)return;
          if(cart.lines.length)held.push({id:uid(),ts:Date.now(),lines:cart.lines.map(l=>({...l})),customer:cart.customer,mode:cart.mode,disc:cart.disc,dtype:cart.dtype});
          held=held.filter(x=>x.id!==h.id);lsSet('kasir-held',held);
          cart.lines=h.lines.map(l=>({...l}));cart.customer=h.customer||'';cart.mode=h.mode||'retail';cart.disc=h.disc||0;cart.dtype=h.dtype||'rp';cart.cash=0;
          cust.value=cart.customer;setMoney(disc,cart.disc);cashI.value='';
          lines();grid();sums();api.close();
        }else if(dr){held=held.filter(x=>x.id!==dr.dataset.drop);lsSet('kasir-held',held);draw();sums()}
      };
    }});
  }
  async function pay(){
    const L=cartLines();if(!L.length)return;
    const t=totals(),m=cart.method;
    let paid=0,change=0;
    if(m==='cash'){
      if(cart.cash<t.total){toast('Uang diterima kurang dari total','warn');cashI.focus();return}
      paid=cart.cash;change=paid-t.total;
    }else if(m==='split'){
      const sp=cart.sp,nonCash=sp.transfer+sp.qris;
      if(nonCash>t.total){toast('Transfer + QRIS melebihi total belanja','warn');return}
      paid=sp.cash+nonCash;
      if(paid<t.total){toast('Pembayaran campuran masih kurang '+rp(t.total-paid),'warn');return}
      change=paid-t.total;
    }else if(m==='tempo'){
      if(!cart.customer.trim()){toast('Isi nama pelanggan untuk transaksi tempo','warn');cust.focus();return}
    }else paid=t.total;
    if(!S.meta.allowNegative){
      const bad=L.find(x=>!x.p.service&&x.qty>stockOf(x.p));
      if(bad){toast('Stok '+bad.p.name+' tidak cukup (tersisa '+num(stockOf(bad.p))+')','warn');return}
    }
    const now=Date.now(),id='t'+uid();
    const sale={type:'sale',ts:now,no:nextNo(now),cashier:cashierName(),cashierId:cashierId(),customer:cart.customer.trim(),priceMode:cart.mode,
      lines:L.map(x=>({pid:x.p.id,sku:x.p.sku,name:x.p.name,unit:x.p.unit||'',qty:x.qty,price:x.price,buy:+x.p.buy||0,service:!!x.p.service})),
      sub:t.sub,disc:t.disc,tax:t.tax,total:t.total,method:m,paid,change,settled:m!=='tempo',voided:false};
    if(m==='split'){
      sale.sp={...cart.sp};
      sale.pays=[{m:'cash',amt:cart.sp.cash-change},{m:'transfer',amt:cart.sp.transfer},{m:'qris',amt:cart.sp.qris}].filter(x=>x.amt>0);
    }
    const btn=g('kpay');btn.disabled=true;
    try{await put('trx',id,sale);reset();g('kcart').classList.remove('show');showReceipt(sale)}
    catch(e){toast('Transaksi gagal disimpan: '+msg(e),'bad');btn.disabled=false}
  }

  q.addEventListener('input',()=>{kq=q.value;klimit=60;grid()});
  q.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const s=q.value.trim();if(!s)return;
    const all=activeProds();
    const ex=exactMatch(all,s);
    const r=ex?[ex]:results();
    if(r.length===1){addTo(r[0]);q.value='';kq='';grid()}
    else if(!r.length)toast('Produk tidak ditemukan','warn');
  });
  g('kchips').onclick=e=>{const b=e.target.closest('button');if(b){kcat=b.dataset.c;klimit=60;chips();grid()}};
  g('kgrid').onclick=e=>{const b=e.target.closest('.item');if(b&&!b.disabled){const p=S.products.get(b.dataset.id);if(p)addTo(p)}};
  g('kmore').onclick=e=>{if(e.target.id==='kmorebtn'){klimit+=60;grid()}};
  g('klines').onclick=e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const pid=b.closest('.line').dataset.pid,ln=cart.lines.find(l=>l.pid===pid),p=S.products.get(pid);if(!ln||!p)return;
    if(b.dataset.a==='inc')addTo(p,1);
    else if(b.dataset.a==='dec'){ln.qty--;if(ln.qty<=0)cart.lines=cart.lines.filter(l=>l.pid!==pid);lines();sums()}
  };
  g('klines').onchange=e=>{
    const b=e.target.closest('input[data-a="qty"]');if(!b)return;
    const pid=b.closest('.line').dataset.pid,ln=cart.lines.find(l=>l.pid===pid),p=S.products.get(pid);if(!ln||!p)return;
    let n=Math.floor(digits(b.value));
    if(n<=0){cart.lines=cart.lines.filter(l=>l.pid!==pid)}
    else{
      if(!p.service&&!S.meta.allowNegative&&n>stockOf(p)){toast('Stok '+p.name+' tersisa '+num(stockOf(p)),'warn');n=Math.max(1,stockOf(p))}
      ln.qty=n;
    }
    lines();sums();
  };
  g('kmode').onclick=e=>{const b=e.target.closest('button');if(b){cart.mode=b.dataset.m;grid();lines();sums()}};
  g('kdt').onclick=e=>{const b=e.target.closest('button');if(b){cart.dtype=b.dataset.t;sums()}};
  g('kmeth').onclick=e=>{const b=e.target.closest('button');if(b){cart.method=b.dataset.p;sums()}};
  g('ksp-fill').onclick=()=>{const t=totals();cart.sp.cash=Math.max(0,t.total-cart.sp.transfer-cart.sp.qris);setMoney(spI.cash,cart.sp.cash);sums()};
  g('kquick').onclick=e=>{const b=e.target.closest('button');if(b){cart.cash=+b.dataset.v;setMoney(cashI,cart.cash);sums()}};
  g('khold').onclick=hold;g('krecall').onclick=recall;
  g('kclear').onclick=async()=>{if(!cart.lines.length)return;if(await ask('Kosongkan keranjang?','Kosongkan',true))reset()};
  g('kpay').onclick=pay;
  g('kbar').onclick=()=>g('kcart').classList.add('show');
  g('kclose').onclick=()=>g('kcart').classList.remove('show');
  if(!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))setTimeout(()=>q.focus(),50);
  return {update(){g('knote').hidden=locked();chips();grid();lines();sums()}};
};

let pq='',pcat='',pflt='',plimit=100;
const CAT_DEFAULT=['Oli & Pelumas','Busi','Filter','Rem','CVT & Transmisi','Kopling','Rantai & Gir','Ban & Velg','Kelistrikan','Aki','Lampu','Suspensi','Mesin','Body & Cover','Aksesoris','Jasa'];
const CAT_CODE={'Oli & Pelumas':'OLI','Busi':'BSI','Filter':'FIL','Rem':'REM','CVT & Transmisi':'CVT','Kopling':'KPL','Rantai & Gir':'RGR','Ban & Velg':'BAN','Kelistrikan':'LIS','Aki':'AKI','Lampu':'LMP','Suspensi':'SUS','Mesin':'MSN','Body & Cover':'BDY','Aksesoris':'AKS','Jasa':'JSA'};
function genSku(cat){
  const pre=CAT_CODE[cat]||((String(cat||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase())||'UMM');
  let mx=0;
  for(const p of S.products.values()){const m=String(p.sku||'').toUpperCase().match(new RegExp('^'+pre+'-(\\d+)$'));if(m)mx=Math.max(mx,+m[1])}
  return pre+'-'+String(mx+1).padStart(4,'0');
}
const CSV_HEAD=['sku','barcode','nama','merek','kategori','satuan','harga_beli','harga_jual','harga_grosir','stok_awal','stok_min','rak','kompatibel','oem'];
const ALIAS={sku:['sku','kode'],barcode:['barcode','kodebarcode'],name:['nama','namaproduk','name','produk'],brand:['merek','brand'],category:['kategori','category'],unit:['satuan','unit'],buy:['hargabeli','beli','buy','hpp'],sell:['hargajual','jual','sell','harga'],wholesale:['hargagrosir','grosir','wholesale'],opening:['stokawal','stok','stock','qty'],min:['stokmin','minimum','min','stokminimum'],rack:['rak','lokasi'],compat:['kompatibel','motor','tipemotor','compat'],oem:['oem','nopart','partnumber','nooem']};

VIEWS.produk=function(root){
  root.innerHTML=
  '<div class="toolbar"><div class="searchbar"><input id="pq" class="input" type="search" placeholder="Cari SKU, barcode, nama, merek, tipe motor…" autocomplete="off"></div>'+
  '<select id="pcat" class="select" aria-label="Kategori"></select>'+
  '<select id="pflt" class="select" aria-label="Filter stok"><option value="">Semua stok</option><option value="low">Menipis</option><option value="out">Habis</option><option value="off">Nonaktif</option></select></div>'+
  '<div class="toolbar sub"><span class="muted" id="pcount"></span><span class="grow"></span>'+
  '<button type="button" class="btn ghost" id="pimp">Impor CSV</button><button type="button" class="btn ghost" id="pexp">Ekspor CSV</button><button type="button" class="btn primary" id="padd">+ Produk baru</button></div>'+
  '<div id="pbody"></div><div id="pmore" style="margin-top:12px"></div>';
  const g=id=>$('#'+id,root);
  g('pq').value=pq;g('pflt').value=pflt;
  const ro=()=>eff()<2;
  function fill(){
    ['padd','pimp','pexp'].forEach(i=>{g(i).hidden=ro()});
    const sel=g('pcat'),cs=cats();
    sel.innerHTML='<option value="">Semua kategori</option>'+cs.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
    if(pcat&&!cs.includes(pcat))pcat='';
    sel.value=pcat;
  }
  function list(){
    return prodList().filter(p=>{
      if(pcat&&p.category!==pcat)return false;
      if(pq.trim()&&!matchQ(p,pq))return false;
      if(pflt==='off')return p.active===false;
      if(p.active===false)return false;
      if(pflt==='low')return !p.service&&stockOf(p)>0&&stockOf(p)<=(+p.min||0);
      if(pflt==='out')return !p.service&&stockOf(p)<=0;
      return true;
    });
  }
  function draw(){
    const r=list(),shown=r.slice(0,plimit);
    g('pcount').textContent=num(r.length)+' dari '+num(S.products.size)+' produk';
    if(!S.products.size){
      g('pbody').innerHTML=catEmpty('','Belum ada produk','Tambahkan produk pertama atau impor daftar produk dari file CSV. Setiap produk punya SKU, barcode, harga, stok, dan lokasi rak.');
      g('pmore').innerHTML='';return;
    }
    if(!r.length){g('pbody').innerHTML=catEmpty('','Tidak ada produk yang cocok','Ubah kata kunci atau filter.');g('pmore').innerHTML='';return}
    const hb=ro();
    g('pbody').innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>SKU</th><th>Produk</th><th class="hide-sm">Rak</th><th class="num">Stok</th>'+(hb?'':'<th class="num hide-sm">Harga beli</th>')+'<th class="num">Harga jual</th></tr></thead><tbody>'+
      shown.map(p=>'<tr data-id="'+esc(p.id)+'" class="'+(p.active===false?'off':'')+'"><td><span class="sku">'+esc(p.sku)+'</span></td>'+
        '<td class="nm"><b>'+esc(p.name)+'</b><small>'+esc([p.brand,p.category].filter(Boolean).join(' · '))+(p.compat?' · '+esc(p.compat):'')+'</small></td>'+
        '<td class="hide-sm">'+esc(p.rack||'—')+'</td><td class="num">'+stockBadge(p)+'</td>'+
        (hb?'':'<td class="num hide-sm">'+num(p.buy)+'</td>')+'<td class="num">'+num(p.sell)+'</td></tr>').join('')+'</tbody></table></div>';
    g('pmore').innerHTML=r.length>shown.length?'<button type="button" class="btn ghost" id="pmorebtn">Tampilkan lebih banyak ('+num(r.length-shown.length)+' lagi)</button>':'';
  }
  g('pq').addEventListener('input',debounce(()=>{pq=g('pq').value;plimit=100;draw()},120));
  g('pcat').onchange=()=>{pcat=g('pcat').value;plimit=100;draw()};
  g('pflt').onchange=()=>{pflt=g('pflt').value;plimit=100;draw()};
  g('pbody').onclick=e=>{
    const tr=e.target.closest('tr[data-id]');if(!tr)return;
    if(ro()){
      const p=S.products.get(tr.dataset.id);if(!p)return;
      modal({title:p.name,build:b=>{b.innerHTML='<dl class="kv"><dt>SKU</dt><dd>'+esc(p.sku)+'</dd><dt>Merek</dt><dd>'+esc(p.brand||'—')+'</dd><dt>Kategori</dt><dd>'+esc(p.category||'—')+'</dd><dt>Rak</dt><dd>'+esc(p.rack||'—')+'</dd><dt>Stok</dt><dd>'+(p.service?'Jasa':num(stockOf(p))+' '+esc(p.unit||''))+'</dd><dt>Harga jual</dt><dd>'+rp(p.sell)+'</dd>'+(+p.wholesale>0?'<dt>Harga grosir</dt><dd>'+rp(p.wholesale)+'</dd>':'')+'<dt>Cocok untuk</dt><dd>'+esc(p.compat||'—')+'</dd><dt>No. OEM</dt><dd>'+esc(p.oem||'—')+'</dd></dl>'},footer:[{label:'Tutup',cls:'primary',fn:a=>a.close()}]});
    }else productEditor(tr.dataset.id);
  };
  g('pmore').onclick=e=>{if(e.target.id==='pmorebtn'){plimit+=100;draw()}};
  g('padd').onclick=()=>productEditor(null);
  g('pimp').onclick=importProducts;
  g('pexp').onclick=()=>{
    const rows=[CSV_HEAD.slice(0,9).concat(['stok_min','rak','kompatibel','oem','stok_saat_ini'])];
    prodList().forEach(p=>rows.push([p.sku,p.barcode||'',p.name,p.brand||'',p.category||'',p.unit||'',p.buy||0,p.sell||0,p.wholesale||0,p.min||0,p.rack||'',p.compat||'',p.oem||'',p.service?'':stockOf(p)]));
    saveFile('produk-'+today()+'.csv',toCSV(rows));
  };
  return {update(){fill();draw()}};
};

function productEditor(id){
  const old=id?S.products.get(id):null;
  const P=old||{unit:'pcs',min:+S.meta.lowDefault||3,active:true,opening:0,buy:0,sell:0,wholesale:0,service:false};
  const sups=[...S.suppliers.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'id'));
  modal({title:old?'Ubah produk':'Produk baru',wide:true,lock:true,build:(b)=>{
    b.innerHTML=
    '<div class="hint bad" id="f-err" hidden></div>'+
    '<div class="form-grid">'+
      '<label class="field"><span>SKU</span><div style="display:flex;gap:6px"><input id="f-sku" class="input mono" value="'+esc(P.sku||'')+'" placeholder="Kosongkan untuk otomatis" autocomplete="off"><button type="button" class="btn ghost" id="f-auto">Otomatis</button></div></label>'+
      '<label class="field"><span>Barcode</span><input id="f-bar" class="input mono" value="'+esc(P.barcode||'')+'" placeholder="Scan atau ketik" autocomplete="off"></label>'+
      '<label class="field span2"><span>Nama produk</span><input id="f-name" class="input" value="'+esc(P.name||'')+'" placeholder="mis. Kampas Rem Depan Honda Beat" autocomplete="off"></label>'+
      '<label class="field"><span>Merek</span><input id="f-brand" class="input" value="'+esc(P.brand||'')+'" autocomplete="off"></label>'+
      '<label class="field"><span>Kategori</span><input id="f-cat" class="input" list="dl-cat" value="'+esc(P.category||'')+'" autocomplete="off"></label>'+
      '<label class="field"><span>Satuan</span><input id="f-unit" class="input" list="dl-unit" value="'+esc(P.unit||'pcs')+'" autocomplete="off"></label>'+
      '<label class="field"><span>Rak / lokasi</span><input id="f-rack" class="input" value="'+esc(P.rack||'')+'" placeholder="mis. A2" autocomplete="off"></label>'+
      '<label class="field"><span>Harga beli (Rp)</span><input id="f-buy" class="input" autocomplete="off"></label>'+
      '<label class="field"><span>Harga jual eceran (Rp)</span><input id="f-sell" class="input" autocomplete="off"></label>'+
      '<label class="field"><span>Harga grosir / bengkel (Rp)</span><input id="f-whl" class="input" autocomplete="off"></label>'+
      '<div class="field"><span>Margin</span><div id="f-margin" class="hint" style="padding-top:10px">—</div></div>'+
      (old?'<div class="field"><span>Stok saat ini</span><div style="padding-top:8px"><b>'+(P.service?'Jasa (tanpa stok)':num(stockOf(old))+' '+esc(P.unit||''))+'</b><div class="hint">Ubah lewat Stok → Barang masuk atau Opname.</div></div></div>':
        '<label class="field"><span>Stok awal</span><input id="f-open" class="input" autocomplete="off" placeholder="0"></label>')+
      '<label class="field"><span>Stok minimum (peringatan)</span><input id="f-min" class="input" autocomplete="off"></label>'+
      '<label class="field span2"><span>Cocok untuk motor</span><input id="f-compat" class="input" value="'+esc(P.compat||'')+'" placeholder="mis. Honda Beat, Vario 110, Scoopy" autocomplete="off"></label>'+
      '<label class="field"><span>No. OEM / part number</span><input id="f-oem" class="input mono" value="'+esc(P.oem||'')+'" autocomplete="off"></label>'+
      '<label class="field"><span>Pemasok utama</span><select id="f-sup" class="select"><option value="">—</option>'+sups.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===P.supplierId?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label>'+
      '<label class="check"><input type="checkbox" id="f-svc"'+(P.service?' checked':'')+'> Produk jasa (tanpa stok)</label>'+
      '<label class="check"><input type="checkbox" id="f-act"'+(P.active!==false?' checked':'')+'> Aktif dijual di kasir</label>'+
    '</div>'+
    '<datalist id="dl-cat">'+[...new Set(CAT_DEFAULT.concat(cats()))].map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist>'+
    '<datalist id="dl-unit"><option value="pcs"><option value="set"><option value="pasang"><option value="botol"><option value="liter"><option value="kotak"><option value="meter"><option value="unit"></datalist>';
    const g=i=>$('#'+i,b);
    setMoney(g('f-buy'),P.buy);setMoney(g('f-sell'),P.sell);setMoney(g('f-whl'),P.wholesale);setMoney(g('f-min'),P.min);
    const marg=()=>{
      const bu=val(g('f-buy')),se=val(g('f-sell')),m=g('f-margin');
      if(!se){m.textContent='—';m.className='hint';return}
      if(se<bu){m.textContent='Harga jual di bawah harga beli (rugi '+rp(bu-se)+')';m.className='hint bad';return}
      m.textContent=rp(se-bu)+' per unit · '+Math.round((se-bu)/se*100)+'% dari harga jual';m.className='hint ok';
    };
    [['f-buy',marg],['f-sell',marg],['f-whl'],['f-min']].forEach(x=>money(g(x[0]),x[1]));
    if(g('f-open'))money(g('f-open'));
    marg();
    g('f-auto').onclick=()=>{g('f-sku').value=genSku(g('f-cat').value.trim())};
    const svc=()=>{const s=g('f-svc').checked;g('f-min').disabled=s;if(g('f-open'))g('f-open').disabled=s};
    g('f-svc').onchange=svc;svc();
  },footer:[
    {label:'Batal',cls:'ghost',fn:a=>a.close()},
    {label:'Simpan produk',cls:'primary',fn:async(a,bt)=>{
      const g=i=>$('#'+i,a.body),err=m=>{const e=g('f-err');e.textContent=m;e.hidden=false;a.body.scrollIntoView({block:'start'})};
      const name=g('f-name').value.trim();
      if(!name){err('Nama produk wajib diisi.');g('f-name').focus();return}
      const category=g('f-cat').value.trim()||'Umum';
      const sku=(g('f-sku').value.trim()||genSku(category)).toUpperCase();
      if([...S.products.values()].some(x=>x.id!==id&&String(x.sku||'').toUpperCase()===sku)){err('SKU '+sku+' sudah dipakai produk lain.');g('f-sku').focus();return}
      const barcode=g('f-bar').value.trim();
      if(barcode&&[...S.products.values()].some(x=>x.id!==id&&String(x.barcode||'')===barcode)){err('Barcode ini sudah dipakai produk lain.');g('f-bar').focus();return}
      const svc=g('f-svc').checked;
      const doc={...(old||{}),sku,barcode,name,brand:g('f-brand').value.trim(),category,unit:g('f-unit').value.trim()||'pcs',rack:g('f-rack').value.trim(),
        buy:val(g('f-buy')),sell:val(g('f-sell')),wholesale:val(g('f-whl')),min:svc?0:val(g('f-min')),compat:g('f-compat').value.trim(),oem:g('f-oem').value.trim(),
        supplierId:g('f-sup').value,service:svc,active:g('f-act').checked,updated:Date.now()};
      if(!old){doc.opening=svc?0:val(g('f-open'));doc.created=Date.now()}
      bt.disabled=true;
      try{await put('products',id||('p'+uid()),doc);toast(old?'Produk diperbarui':'Produk ditambahkan','ok');a.close()}
      catch(e){err('Gagal menyimpan: '+msg(e));bt.disabled=false}
    }}
  ]});
}

function importProducts(){
  modal({title:'Impor produk dari CSV',wide:true,lock:true,build:(b,api)=>{
    b.innerHTML=
    '<p>Unggah file CSV dengan kolom: <span class="mono sm">'+CSV_HEAD.join(', ')+'</span>. Produk dengan SKU yang sudah ada akan diperbarui (stok awal tidak diubah). Pemisah koma atau titik koma sama-sama dikenali.</p>'+
    '<div><button type="button" class="btn ghost sm" id="i-tpl">Unduh template</button></div>'+
    '<input type="file" id="i-file" accept=".csv,.txt,text/csv" class="input">'+
    '<div id="i-prev" class="stack"></div>';
    $('#i-tpl',b).onclick=()=>saveFile('template-produk.csv',toCSV([CSV_HEAD,
      ['OLI-0001','8991234500011','Oli Mesin 0.8L Matic','Yamalube','Oli & Pelumas','botol',38000,46000,42000,24,6,'A1','Yamaha Mio, Nmax','' ],
      ['BSI-0001','','Busi NGK CR7HSA','NGK','Busi','pcs',16000,24000,20000,30,10,'A3','Honda Beat, Scoopy','CR7HSA']]));
    let plan=null;
    $('#i-file',b).onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      const prev=$('#i-prev',b);
      try{
        const rows=parseCSV(await f.text());
        if(rows.length<2){prev.innerHTML='<p class="hint bad">File kosong atau hanya berisi header.</p>';return}
        const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z]/g,''));
        const idx={};
        Object.keys(ALIAS).forEach(k=>{const i=head.findIndex(h=>ALIAS[k].includes(h));if(i>=0)idx[k]=i});
        if(idx.name==null){prev.innerHTML='<p class="hint bad">Kolom nama produk tidak ditemukan. Gunakan header "nama".</p>';return}
        const bySku=new Map([...S.products.values()].map(p=>[String(p.sku||'').toUpperCase(),p]));
        const seen=new Set();plan={add:[],upd:[],skip:0};
        const take=(r,k)=>idx[k]==null?undefined:String(r[idx[k]]==null?'':r[idx[k]]).trim();
        rows.slice(1).forEach(r=>{
          const name=take(r,'name');if(!name){plan.skip++;return}
          let sku=(take(r,'sku')||'').toUpperCase();
          const ex=sku?bySku.get(sku):null;
          const f2={};
          ['barcode','brand','category','unit','rack','compat','oem'].forEach(k=>{const v=take(r,k);if(v)f2[k]=v});
          ['buy','sell','wholesale','min'].forEach(k=>{const v=take(r,k);if(v!==undefined&&v!=='')f2[k]=toNum(v)});
          if(ex){plan.upd.push({id:ex.id,doc:{...ex,...f2,name,updated:Date.now()}})}
          else{
            const category=f2.category||'Umum';
            if(!sku||seen.has(sku)){
              const base=genSku(category),mm=base.match(/^(.*-)(\d+)$/);
              let n=mm?+mm[2]:1;const pre=mm?mm[1]:'UMM-';
              sku=base;
              while(seen.has(sku)||bySku.has(sku)){n++;sku=pre+String(n).padStart(4,'0')}
            }
            seen.add(sku);
            plan.add.push({id:'p'+uid(),doc:{sku,name,category,unit:'pcs',min:+S.meta.lowDefault||3,buy:0,sell:0,wholesale:0,...f2,opening:toNum(take(r,'opening')||0),active:true,service:category==='Jasa',created:Date.now(),updated:Date.now()}});
          }
        });
        prev.innerHTML='<div class="rowline"><span>Produk baru</span><b>'+plan.add.length+'</b></div><div class="rowline"><span>Produk diperbarui</span><b>'+plan.upd.length+'</b></div><div class="rowline"><span>Baris dilewati (tanpa nama)</span><b>'+plan.skip+'</b></div>'+
          '<button type="button" class="btn primary" id="i-go"'+(plan.add.length+plan.upd.length?'':' disabled')+'>Impor sekarang</button><div class="meter" id="i-meter" hidden><i style="width:0"></i></div>';
        $('#i-go',b).onclick=async()=>{
          const go=$('#i-go',b),m=$('#i-meter',b);go.disabled=true;m.hidden=false;
          const all=plan.add.concat(plan.upd);let fail=0;
          await pool(all,async it=>{try{await put('products',it.id,it.doc)}catch(e){fail++}},4,(d,n)=>{$('i',m).style.width=Math.round(d/n*100)+'%'});
          toast(fail?(all.length-fail)+' produk tersimpan, '+fail+' gagal':all.length+' produk berhasil diimpor',fail?'warn':'ok');
          api.close();
        };
      }catch(err){prev.innerHTML='<p class="hint bad">Gagal membaca file: '+esc(msg(err))+'</p>'}
    };
  },footer:[{label:'Tutup',cls:'ghost',fn:a=>a.close()}]});
}
